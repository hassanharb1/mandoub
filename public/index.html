<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#282825">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>دفتر المندوب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.dir="rtl";document.documentElement.lang="ar";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- the font never blocks the first paint: on a slow line the app opens with the system font and switches when Cairo arrives -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom nav + capture button */
:root{
  --bg:#F5F0E7; --surface:#FFFDF9; --sunk:#EDE6DA; --line:#E0D7C8;
  --fg:#282825; --muted:#6F6A60; --accent:#BD572F; --accent-ink:#FFFFFF; --accent-soft:#F6E2D8;
  --ok:#2F7D4F; --ok-soft:#DDEFE3; --warn:#A86A00; --warn-soft:#F8EBCB; --bad:#B23A2E; --bad-soft:#F6DCD8; --info:#2D5F8A; --info-soft:#DCE8F3;
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1D1B; --surface:#282825; --sunk:#323230; --line:#3D3C38;
  --fg:#F5F0E7; --muted:#B3ACA0; --accent:#E07A4F; --accent-ink:#1D1D1B; --accent-soft:#4A2F24;
  --ok:#6CC28E; --ok-soft:#1F3A2A; --warn:#E5B04A; --warn-soft:#41351C; --bad:#EF7F72; --bad-soft:#47241F; --info:#7FB2DE; --info-soft:#1E3245;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1D1D1B; --surface:#282825; --sunk:#323230; --line:#3D3C38;
  --fg:#F5F0E7; --muted:#B3ACA0; --accent:#E07A4F; --accent-ink:#1D1D1B; --accent-soft:#4A2F24;
  --ok:#6CC28E; --ok-soft:#1F3A2A; --warn:#E5B04A; --warn-soft:#41351C; --bad:#EF7F72; --bad-soft:#47241F; --info:#7FB2DE; --info-soft:#1E3245;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top h1{font-size:20px;font-weight:800;margin:0;flex:1;min-width:0;line-height:1.3}
header.top h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 0}

.demo{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 12px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:15px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.sec h2 .count{font-size:12px;background:var(--sunk);color:var(--muted);border-radius:99px;padding:0 9px;font-weight:700}
.sec h2 a,.sec h2 button.link{margin-inline-start:auto}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:4px}

/* hero cash */
.hero{background:var(--fg);color:var(--bg);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero .lbl{font-size:12.5px;opacity:.75;font-weight:600}
.hero .big{font-size:28px;font-weight:800;line-height:1.2}
.hero .mid{font-size:19px;font-weight:800;line-height:1.3}
.hero .cur{font-size:13px;font-weight:600;opacity:.75;margin-inline-start:4px}
.hero .full{grid-column:1/-1;display:flex;gap:8px}
.hero .hcol{background:none;border:0;padding:0;color:inherit;text-align:start}
.hero .full button{flex:1}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;line-height:1.35}
.row .s{font-size:13px;color:var(--muted);line-height:1.4}
.row .end{text-align:end;flex:none}
.row .amt{font-weight:800}
.row.alert{align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none;font-size:16px}

.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;white-space:nowrap}
.st-draft{background:var(--bad-soft);color:var(--bad)}
.st-sent{background:var(--warn-soft);color:var(--warn)}
.st-registered{background:var(--info-soft);color:var(--info)}
.st-shipped{background:var(--accent-soft);color:var(--accent)}
.st-delivered{background:var(--ok-soft);color:var(--ok)}
.pill.muted{background:var(--sunk);color:var(--muted)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;font-size:15px}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn.onhero{background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.18)}
:root[data-theme="dark"] .btn.onhero{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.onhero{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.15)}}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;align-items:flex-start;gap:10px}
.card .hd .main{flex:1;min-width:0}
.items{font-size:13.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:17px;font-weight:800;line-height:1.3}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;flex:1;min-width:0;padding:11px 0;outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}

.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom .badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;border-radius:99px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.fab{position:fixed;z-index:31;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 244px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:0 18px;height:54px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:15px}
.fab svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet .sh h3{margin:0;font-size:18px;font-weight:800;flex:1}
.sheet .sb>*{flex-shrink:0}
.sheet .sb{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.sheet .sf{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);font-weight:600;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.inrow{display:flex;gap:8px}.inrow>*{flex:1;min-width:0}
.mic{flex:none!important;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.mic svg{width:20px;height:20px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* product picker */
.prod{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod .main{flex:1;min-width:0}
.prod.sel{background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
.stepper button.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper input{width:48px;text-align:center;border:0;background:none;font-weight:800;font-size:16px;padding:0}
.prod{align-items:flex-start}
.prod .t{font-weight:700;line-height:1.4}
.prod .s{color:var(--muted);font-size:13px}
.thumb{width:68px;height:68px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;flex:none}
.thumb img,.pcard img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph,.pcard .ph{width:100%;height:100%;display:grid;place-items:center;color:#9a948a;font-size:12px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.useg{display:flex;background:var(--sunk);border-radius:11px;padding:2px;gap:2px}
.useg button{min-width:40px;height:36px;border:0;background:none;border-radius:9px;font-weight:800;font-size:16px;color:var(--muted)}
.useg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lnote{margin-top:8px;padding:8px 10px;font-size:14px;font-weight:600}
.items small{color:var(--muted);font-size:12.5px}
.per{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.per input{width:70px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-weight:800;text-align:center}
.per.need input{border-color:var(--warn)}
.addbtn{flex:none;min-height:40px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 14px;align-self:center}
.code{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:6px;padding:0 6px;margin-inline-start:4px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;text-align:start;display:flex;flex-direction:column}
.pcard .im{aspect-ratio:1;background:#fff;border-bottom:1px solid var(--line)}
.pcard .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcard .t{font-weight:700;font-size:14px;line-height:1.4}
.pcard .pr{font-weight:800;color:var(--accent)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,20,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.lightbox .im{width:min(100%,420px);aspect-ratio:1;background:#fff;border-radius:16px;overflow:hidden}
.lightbox .im img{width:100%;height:100%;object-fit:contain}
.lightbox .cap{color:#fff;text-align:center;font-weight:700;max-width:420px}
.lightbox .cap .s{font-weight:600;opacity:.8;font-size:14px}
.lightbox .btns{width:min(100%,420px)}
.oimg{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:120px;display:grid;place-items:center;overflow:hidden}
.oimg img{width:100%;display:block}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.total .big{font-size:20px}

.msg{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.7}
.toast{position:fixed;z-index:80;bottom:calc(140px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;max-width:90%;text-align:center}
.ledger .row .amt.plus{color:var(--bad)}.ledger .row .amt.minus{color:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.call{display:flex;gap:8px;flex-wrap:wrap}
.tagline{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 0}
</style>

<script>

  el.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:999;background:#B23A2E;color:#fff;padding:12px 14px;border-radius:12px;font:600 14px/1.6 system-ui,sans-serif;direction:rtl";
  document.body.appendChild(el)}el.textContent="حصلت مشكلة في التطبيق. صوّر الشاشة دي وابعتها: "+(e.message||"")+" ("+(e.filename||"").split("/").pop()+":"+(e.lineno||"")+")"}catch(x){}});
</script>

<script>
(function(){
"use strict";
const DAY=864e5, KEY="mandoub.v1";

  {k:"draft",t:"لسه ما اتبعتش",next:"اتبعت"},

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>`<span class="num">${Math.round(n).toLocaleString("en-US")}</span>`;
const cust=id=>S.customers.find(c=>c.id===id)||{name:"عميل محذوف",owner:"",area:""};
// a line is pieces (ق) or cartons (ك); a carton line counts only once we know how many pieces are in it
const lineTotal=i=>i.qty*(i.price||0)*(i.unit==="ك"?(i.per||0):1);
const subTotal=o=>o.items.reduce((a,i)=>a+lineTotal(i),0);
// customer discount (%) is per order, typed by the rep; empty means none
const total=o=>subTotal(o)*(1-(+o.disc||0)/100);
const PAY={cash:"كاش",credit:"آجل"};
const unitName=(i,short)=>i.unit==="ك"?(short?"ك":"كرتونة"):(short?"ق":"قطعة");
const fmtDay=t=>{const d=new Date(t);return `${WD[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`};
function dayLabel(t){const d=daysSince(t);return d===0?`النهارده · ${fmtDay(t)}`:d===1?`امبارح · ${fmtDay(t)}`:fmtDay(t)}
const isoDay=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
// date input → timestamp: keep the original time if the day didn't change, now for today, noon for another day
function fromIso(v,orig){if(!v)return orig||Date.now();if(orig&&isoDay(orig)===v)return orig;if(v===isoDay(Date.now()))return Date.now();
  const [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d,12,0,0,0).getTime()}
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const daysSince=t=>Math.round((sod(Date.now())-sod(t))/DAY);
function when(t){const d=daysSince(t);const w=WD[new Date(t).getDay()];
  if(d<=0)return"النهارده";if(d===1)return"امبارح";if(d===2)return`يوم ${w} (من يومين)`;if(d<7)return`يوم ${w} (من ${d} أيام)`;if(d<=10)return`من ${d} أيام`;return`من ${d} يوم`}
function itemName(i){return i.name||prod(i.pid)?.name||"منتج"}
// orders carry no reliable money amount (carton prices are unknown), so the balance is opening − collections
function balance(cid){const c=cust(cid);let b=c.opening||0;
  S.payments.forEach(p=>{if(p.customerId===cid)b-=p.amount});return b}
function lastPayment(cid){return S.payments.filter(p=>p.customerId===cid).reduce((m,p)=>Math.max(m,p.date),0)}
function cashInHand(){return S.payments.reduce((a,p)=>a+p.amount,0)-S.handovers.reduce((a,h)=>a+h.amount,0)}
function rhythm(cid){const ts=S.orders.filter(o=>o.customerId===cid).map(o=>o.created).sort((a,b)=>a-b);
  if(ts.length<3)return null;let g=0;for(let i=1;i<ts.length;i++)g+=ts[i]-ts[i-1];const avg=Math.max(1,Math.round(g/(ts.length-1)/DAY));
  const since=daysSince(ts[ts.length-1]);return{avg,since,late:since>=Math.max(avg*1.5,avg+5)}}
function initials(n){return (n||"؟").replace(/^(محل|مؤسسة|مركز|كهرباء|ال)\s*/,"").trim().charAt(0)}

function alerts(){
  const out=[];
  S.orders.filter(o=>o.status==="draft").sort((a,b)=>a.created-b.created).forEach(o=>{
    const d=daysSince(o.created);out.push({lvl:d>=(+S.settings.remind||1)?"bad":"warn",cid:o.customerId,order:o.id,
      t:`طلب ${cust(o.customerId).name} لسه ما اتبعتش`,s:`اتسجل ${when(o.created)} · ${o.items.length} أصناف`})});
  S.orders.filter(o=>o.status==="sent"&&daysSince(o.hist.sent||o.created)>=2).forEach(o=>out.push({lvl:"warn",cid:o.customerId,order:o.id,
    t:`طلب #${o.no} اتبعت ومحدش أكد تسجيله`,s:`${cust(o.customerId).name} · اتبعت ${when(o.hist.sent||o.created)}`}));
  S.orders.filter(o=>o.status!=="draft"&&o.pay==="").forEach(o=>out.push({lvl:"info",cid:o.customerId,order:o.id,
    t:`طلب #${o.no}: كاش ولا آجل؟`,s:`${cust(o.customerId).name} · لسه ما اتحددش`}));
  S.requests.filter(r=>!r.done).sort((a,b)=>a.created-b.created).forEach(r=>out.push({lvl:"info",cid:r.customerId,req:r.id,
    t:`${cust(r.customerId).name} مستني حاجة`,s:`${r.text} · ${when(r.created)}`}));
  S.customers.forEach(c=>{const rh=rhythm(c.id);if(rh&&rh.late)out.push({lvl:"warn",cid:c.id,
    t:`${c.name} بقاله ${rh.since} يوم مطلبش`,s:`عادةً بيطلب كل ${rh.avg} يوم تقريبًا · كلّمه`})});
  S.customers.forEach(c=>{const b=balance(c.id),lp=lastPayment(c.id);const age=lp?daysSince(lp):99;
    if(b>0&&age>=14)out.push({lvl:"warn",cid:c.id,money:true,t:`${c.name} عليه ${Math.round(b).toLocaleString("en-US")} ج`,s:lp?`آخر تحصيل ${when(lp)}`:"مفيش تحصيل متسجل"})});
  return out}

/* ---------- voice dictation ---------- */
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const SR=IOS?null:(window.SpeechRecognition||window.webkitSpeechRecognition);let rec=null,micBtn=null,micT=[],heard=false;
function voiceHint(){return SR?"":`<p class="hint">علشان تسجل بصوتك: دوس على علامة المايك اللي في الكيبورد واتكلم</p>`}
function micHTML(target){return SR?`<button type="button" class="mic" data-mic="${target}" aria-label="سجّل بصوتك"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>`:""}
function stopMic(){micT.forEach(clearTimeout);micT=[];const r=rec;rec=null;try{r&&r.abort()}catch(e){}if(micBtn)micBtn.classList.remove("on");micBtn=null}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mic]");if(!b)return;
  if(rec){stopMic();return}const inp=document.getElementById(b.dataset.mic);
  try{rec=new SR();rec.lang="ar-EG";rec.interimResults=true;rec.continuous=false;const base=inp.value?inp.value+" ":"";
    rec.onresult=ev=>{heard=true;let t="";for(const r of ev.results)t+=r[0].transcript;inp.value=base+t};
    rec.onerror=ev=>{toast(ev.error==="not-allowed"?"المايك مش متاح هنا، اسمح بيه من إعدادات المتصفح":"ماسمعتش كويس، جرب تاني");stopMic()};
    rec.onend=()=>stopMic();heard=false;rec.start();micBtn=b;b.classList.add("on");toast("اتكلم دلوقتي…");
    micT.push(setTimeout(()=>{if(rec&&!heard){toast("ماسمعتش حاجة. جرب المايك اللي في الكيبورد");stopMic()}},8000));
    micT.push(setTimeout(()=>{if(rec)stopMic()},25000))}catch(err){toast("التسجيل بالصوت مش متاح على المتصفح ده");stopMic()}});

  const open=orders.filter(o=>o.status!=="delivered"),reqs=S.requests.filter(r=>r.customerId===c.id&&!r.done);

function bindOrderCards(v){

filt.co=CAT.companies[0]?.id||"";filt.pcat="الكل";filt.pq="";

const photo=p=>p&&p.img&&self.CATIMG?self.CATIMG[p.img]:null;
const imgHTML=p=>{const src=photo(p);return src?`<img src="${src}" alt="" decoding="async">`:p&&p.img?`<span class="ph" data-ph="${esc(p.img)}">…</span>`:`<span class="ph">مفيش صورة</span>`};
function loadPhotos(){const sc=document.createElement("script");sc.src="catalog-img.js";
  sc.onload=()=>document.querySelectorAll("[data-ph]").forEach(el=>{const src=self.CATIMG&&self.CATIMG[el.dataset.ph];if(src)el.outerHTML=`<img src="${src}" alt="" decoding="async">`});
  document.body.appendChild(sc)}
const priceTxt=p=>`${money(p.price)} ج للقطعة`;
// colours named in the product name (e.g. "ابيض/اسود") become quick picks on the order line
const COLORS=["ابيض دهبي","اسود دهبي","ابيض","اسود","ورم","دهبي","فضي","RGB"];
function colorsOf(p){let n=p.name;const out=[];COLORS.forEach(c=>{if(n.includes(c)){out.push(c);n=n.split(c).join(" ")}});return out}
// search ignores the company and category tabs, so a name typed anywhere is found
function findProducts(co,cat,q){q=(q||"").trim();
  if(q){const ws=q.split(/\s+/);return CAT.products.filter(p=>ws.every(w=>(p.name+" "+(p.code||"")+" "+coName(p.co)).includes(w)))}
  return CAT.products.filter(p=>p.co===co&&(cat==="الكل"||p.cat===cat))}
const catsOf=co=>["الكل",...new Set(CAT.products.filter(p=>p.co===co).map(p=>p.cat))];
function coSeg(id,extra){return `<div class="seg" id="${id}">${CAT.companies.map(c=>`<button data-co="${c.id}" aria-pressed="${c.id===filt.co}">${esc(c.name)}</button>`).join("")}${extra||""}</div>`}
const searchBox=(id,ph,val)=>`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="${id}" placeholder="${ph}" value="${esc(val||"")}" autocomplete="off" enterkeyhint="search"></div>`;

function lightbox(pid,withOrder){const p=prod(pid);if(!p)return;$(".lightbox")?.remove();
  const el=document.createElement("div");el.className="lightbox";el.setAttribute("role","dialog");el.setAttribute("aria-label",p.name);
  el.innerHTML=`<div class="im">${imgHTML(p)}</div><div class="cap">${esc(p.name)}${p.code?` <span class="code">${esc(p.code)}</span>`:""}<br><span class="s">${esc(coName(p.co))} · ${priceTxt(p)}</span></div>
    <div class="btns">${withOrder?`<button class="btn primary" id="lbo">ضيفه لطلب</button>`:""}<button class="btn ghost" id="lbx">رجوع</button></div>`;
  el.addEventListener("click",e=>{if(e.target===el||e.target.closest("#lbx"))el.remove()});

  el.querySelector("#lbo")?.addEventListener("click",()=>{el.remove();orderEditor({items:[{pid,qty:1,unit:"ق"}]})})}

  const row=p=>{const x=sel[p.id],n=x?x.n:0;
    return `<div class="prod ${n?"sel":""}" data-row="${p.id}"><button class="thumb" data-zoom="${p.id}" aria-label="كبّر الصورة">${imgHTML(p)}</button>
      <div class="main"><div class="t">${esc(p.name)}${p.code?`<span class="code">${esc(p.code)}</span>`:""}</div><div class="s">${q||picked?esc(coName(p.co))+" · ":""}${priceTxt(p)}</div>
      ${n?`<div class="ctl"><div class="stepper"><button class="add" data-p="${p.id}" aria-label="زوّد">+</button><input class="num" data-q="${p.id}" value="${n}" inputmode="numeric" aria-label="العدد"><button data-m="${p.id}" aria-label="أقل">−</button></div>
        <div class="useg" role="group" aria-label="قطعة ولا كرتونة"><button data-u="${p.id}|ق" aria-pressed="${x.u==="ق"}" title="قطعة">ق</button><button data-u="${p.id}|ك" aria-pressed="${x.u==="ك"}" title="كرتونة">ك</button></div></div>
        ${colorsOf(p).length?`<div class="chips" style="margin-top:8px">${colorsOf(p).map(c=>`<button class="chip" data-col="${p.id}|${esc(c)}" aria-pressed="${x.color===c}">${esc(c)}</button>`).join("")}</div>`:""}
        <input class="inp lnote" data-note="${p.id}" value="${esc(x.note)}" placeholder="ملحوظة على الصنف (اللون، تبديل…)">`:""}</div>
      ${n?"":`<button class="addbtn" data-p="${p.id}">+ ضيف</button>`}</div>`};
  // no money total here: carton prices aren't known, so a sum would be wrong
  const sums=()=>{const ls=lines();const n=ls.length+extras.length;$("#pcount").textContent=ls.length;$("#ocount").textContent=n===1?"صنف واحد":`${n} أصناف`};
  const drawList=()=>{
    sh.querySelectorAll("#pco [data-co]").forEach(b=>b.setAttribute("aria-pressed",!picked&&!q&&b.dataset.co===co));
    sh.querySelector("[data-picked]").setAttribute("aria-pressed",picked);
    $("#pcats").hidden=picked||!!q;
    $("#pcats").innerHTML=catsOf(co).map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("");
    const list=picked?lines().map(([id])=>prod(id)).filter(Boolean):findProducts(co,cat,q);
    $("#plist").innerHTML=list.map(row).join("")||`<div class="empty">${picked?"لسه ما اخترتش حاجة":"مفيش منتج بالاسم ده"}</div>`;
    $("#exl").innerHTML=extras.map((e,i)=>`<div class="row"><span class="main t">${esc(e.name)}</span><span class="num">× ${e.qty}</span><button class="link" data-xr="${i}">شيل</button></div>`).join("");
    sums()};
  // redraw only the touched row so the list doesn't jump while tapping
  const redraw=id=>{const el=sh.querySelector(`[data-row="${id}"]`),p=prod(id);if(el&&p)el.outerHTML=row(p);sums()};
  drawList();
  sh.addEventListener("click",e=>{const t=e.target;const p=t.closest("[data-p]"),m=t.closest("[data-m]"),u=t.closest("[data-u]"),c=t.closest("[data-cat]"),
      k=t.closest("#pco [data-co]"),pk=t.closest("[data-picked]"),z=t.closest("[data-zoom]"),x=t.closest("[data-xr]");
    if(p){const id=p.dataset.p;sel[id]=sel[id]||{n:0,u:"ق",color:"",note:""};sel[id].n++;redraw(id)}
    const cl=t.closest("[data-col]");if(cl){const [id,c]=cl.dataset.col.split("|");sel[id].color=sel[id].color===c?"":c;redraw(id)}
    if(m){const id=m.dataset.m;sel[id].n=Math.max(0,sel[id].n-1);if(picked&&!sel[id].n)drawList();else redraw(id)}
    if(u){const [id,un]=u.dataset.u.split("|");sel[id].u=un;redraw(id)}
    if(z)lightbox(z.dataset.zoom,false);
    if(c){cat=c.dataset.cat;drawList()}
    if(k){co=k.dataset.co;filt.co=co;cat="الكل";picked=false;q="";$("#pq").value="";drawList()}
    if(pk){picked=!picked;q="";$("#pq").value="";drawList()}
    if(x){extras.splice(+x.dataset.xr,1);drawList()}
    const py=t.closest("[data-pay]");if(py)sh.querySelectorAll("[data-pay]").forEach(b=>b.setAttribute("aria-pressed",b===py))});

  sh.addEventListener("change",e=>{const i=e.target.closest("[data-q]");if(i){const id=i.dataset.q;sel[id].n=Math.max(0,parseInt(i.value)||0);redraw(id)}});
  // the note is kept as it's typed, without redrawing the row (that would close the keyboard)
  sh.addEventListener("input",e=>{const nt=e.target.closest("[data-note]");if(nt)sel[nt.dataset.note].note=nt.value});
  $("#pq").oninput=e=>{q=e.target.value.trim();if(q)picked=false;drawList()};
  // add a customer without leaving the order; the rest of his details can be filled in later
  $("#ocNew").onclick=()=>{$("#ocBox").hidden=!$("#ocBox").hidden;if(!$("#ocBox").hidden)$("#ocName").focus()};
  $("#ocAdd").onclick=()=>{const n=$("#ocName").value.trim();if(!n)return toast("اكتب اسم العميل");
    const c={id:uid(),name:n,owner:"",area:$("#ocArea").value.trim(),phone:"",opening:0};S.customers.push(c);save();
    const sl=$("#oc");sl.insertAdjacentHTML("beforeend",`<option value="${c.id}">${esc(c.name)}${c.area?` — ${esc(c.area)}`:""}</option>`);sl.value=c.id;
    $("#ocBox").hidden=true;$("#ocName").value="";$("#ocArea").value="";toast(`اتضاف ${n}`)};
  $("#exa").onclick=()=>{const n=$("#exn").value.trim(),k=parseInt($("#exq").value)||1;if(!n)return toast("اكتب اسم المنتج");extras.push({name:n,qty:k,unit:"ق",price:0});$("#exn").value="";$("#exq").value="";drawList()};
  const commit=()=>{const cid=$("#oc").value;if(!cid){toast("اختار العميل الأول");return null}
    const items=[...lines().map(([pid,x])=>{const p=prod(pid);const it={pid,qty:x.n,unit:x.u,price:p?.price||0,name:p?.name||"منتج"};
      if(x.color)it.color=x.color;if(x.note.trim())it.note=x.note.trim();return it}),...extras];
    if(!items.length){toast("ضيف منتج واحد على الأقل");return null}
    let o=editing;if(!o){o={id:uid(),no:S.seq++,status:"draft",created:Date.now(),hist:{}};S.orders.push(o)}
    o.customerId=cid;o.items=items;o.note=$("#on").value.trim();
    o.disc=Math.min(100,Math.max(0,parseFloat($("#odisc").value)||0));o.pay=sh.querySelector('[data-pay][aria-pressed="true"]')?.dataset.pay||"";
    if(init.fromReq){const r=S.requests.find(x=>x.id===init.fromReq);if(r){r.done=true;r.doneAt=Date.now()}}
    save();return o};
  $("#oSave").onclick=()=>{const o=commit();if(!o)return;closeSheet();toast(editing?"اتحفظ":"اتحفظ، وهيفضل يفكرك لحد ما تبعته");render()};
  $("#oSend").onclick=()=>{const o=commit();if(!o)return;closeSheet();render();sendSheet(o.id,!!editing&&editing.status!=="draft")};
}

/* ---------- whatsapp message ---------- */
function waNum(p){p=String(p||"").replace(/\D/g,"");if(p.startsWith("00"))p=p.slice(2);if(p.startsWith("0"))p="2"+p;return p}
// items grouped by company, free-text items last
function groups(o){const g=[];o.items.forEach(i=>{const p=i.pid&&prod(i.pid);const k=p&&p.co?coName(p.co):"أصناف تانية";
  let x=g.find(y=>y.k===k);if(!x){x={k,items:[]};g.push(x)}x.items.push(i)});
  return g.sort((a,b)=>(a.k==="أصناف تانية")-(b.k==="أصناف تانية"))}
function message(o,isEdit){const c=cust(o.customerId);const many=groups(o).length>1;
  return [`${isEdit?"تعديل على ":""}طلب #${o.no}`,`العميل: ${c.name}${c.owner?` (${c.owner})`:""}`,c.area?`المنطقة: ${c.area}`:null,
    ...groups(o).flatMap(g=>["",...(many?[`${g.k}:`]:[]),...g.items.map(i=>{const p=i.pid&&prod(i.pid);
      return `• ${itemName(i)}${p&&p.code?` (${p.code})`:""}${i.color?` · ${i.color}`:""} × ${i.qty} ${unitName(i)}${i.note?`\n   ملحوظة: ${i.note}`:""}`})]),
    o.disc||o.pay?"":null,o.disc?`خصم العميل: ${o.disc}%`:null,o.pay?`الدفع: ${PAY[o.pay]}`:null,
    o.note?`\nملاحظة: ${o.note}`:null,S.settings.rep?`\nمن: ${S.settings.rep}`:null].filter(x=>x!==null).join("\n")}

/* the same order drawn as a picture with the product photos, for the colleague */
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
function wrap(ctx,text,maxW){const out=[];let line="";
  String(text).split(/\s+/).forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
  if(line)out.push(line);return out}
async function orderImage(o,isEdit){
  const F="Cairo,system-ui,Tahoma,sans-serif";
  try{await Promise.all([document.fonts.load(`800 40px Cairo`),document.fonts.load(`700 30px Cairo`),document.fonts.load(`600 24px Cairo`)])}catch(e){}
  const c=cust(o.customerId),gs=groups(o),W=1080,P=44,TH=150,RH=196;
  const imgs={};await Promise.all(o.items.map(async i=>{const p=i.pid&&prod(i.pid);if(p&&p.img&&!(p.img in imgs))imgs[p.img]=await loadImg(photo(p))}));
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font=`600 26px ${F}`;const noteLines=o.note?wrap(ctx,"ملاحظة: "+o.note,W-2*P):[];
  const H=250+gs.length*64+o.items.length*(RH+12)+(noteLines.length?noteLines.length*40+30:0)+110;
  cv.width=W;cv.height=H;ctx.direction="rtl";ctx.textBaseline="middle";
  const R=(x,y,w,h,r,fill)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fillStyle=fill;ctx.fill()};
  ctx.fillStyle="#F5F0E7";ctx.fillRect(0,0,W,H);
  // header
  R(0,0,W,200,0,"#282825");ctx.textAlign="right";ctx.fillStyle="#FFFFFF";ctx.font=`800 46px ${F}`;
  ctx.fillText(`${isEdit?"تعديل على ":""}طلب رقم ${o.no}`,W-P,62);
  ctx.font=`700 32px ${F}`;ctx.fillText(c.name+(c.owner?` (${c.owner})`:""),W-P,120);
  ctx.font=`600 24px ${F}`;ctx.fillStyle="#D9D2C5";ctx.fillText([c.area,fmtDay(o.created),o.disc?`خصم ${o.disc}%`:null,o.pay?PAY[o.pay]:null].filter(Boolean).join(" · "),W-P,166);
  ctx.textAlign="left";ctx.fillStyle="#E07A4F";ctx.font=`800 30px ${F}`;ctx.fillText(`${o.items.length} صنف`,P,62);
  let y=224;
  for(const g of gs){
    if(gs.length>1){ctx.textAlign="right";ctx.fillStyle="#BD572F";ctx.font=`800 30px ${F}`;ctx.fillText(g.k,W-P,y+26);y+=64}
    for(const i of g.items){const p=i.pid&&prod(i.pid);
      R(P,y,W-2*P,RH,22,"#FFFFFF");
      const tx=W-P-16-TH,ty=y+(RH-TH)/2;R(tx,ty,TH,TH,16,"#F7F5F1");
      const im=p&&imgs[p.img];if(im){const s=Math.min(TH/im.width,TH/im.height);ctx.drawImage(im,tx+(TH-im.width*s)/2,ty+(TH-im.height*s)/2,im.width*s,im.height*s)}
      else{ctx.textAlign="center";ctx.fillStyle="#9A948A";ctx.font=`600 22px ${F}`;ctx.fillText("بدون صورة",tx+TH/2,ty+TH/2)}
      // quantity block on the left
      const qx=P+24;ctx.textAlign="left";ctx.direction="ltr";ctx.fillStyle="#282825";ctx.font=`800 52px ${F}`;ctx.fillText(`× ${i.qty}`,qx,y+RH/2-18);
      ctx.direction="rtl";ctx.fillStyle="#BD572F";ctx.font=`800 28px ${F}`;ctx.fillText(unitName(i),qx,y+RH/2+34);
      // name
      const nx=tx-24,nw=nx-(P+230);ctx.textAlign="right";ctx.fillStyle="#282825";ctx.font=`700 31px ${F}`;
      const nl=wrap(ctx,itemName(i),nw).slice(0,2);const sub=p&&p.code||"";
      ctx.font=`600 24px ${F}`;const notel=i.note?wrap(ctx,"ملحوظة: "+i.note,nw).slice(0,2):[];ctx.font=`700 31px ${F}`;
      const blockH=nl.length*42+(i.color?40:0)+(sub?34:0)+notel.length*32;let ly=y+RH/2-blockH/2+21;
      nl.forEach(l=>{ctx.fillText(l,nx,ly);ly+=42});
      if(i.color){ctx.font=`800 28px ${F}`;ctx.fillStyle="#BD572F";ctx.fillText(`اللون: ${i.color}`,nx,ly);ly+=40}
      if(sub){ctx.font=`600 23px ${F}`;ctx.fillStyle="#6F6A60";ctx.fillText(sub,nx,ly-4);ly+=34}
      if(notel.length){ctx.font=`600 24px ${F}`;ctx.fillStyle="#282825";notel.forEach(l=>{ctx.fillText(l,nx,ly-4);ly+=32})}
      y+=RH+12}}
  if(noteLines.length){y+=14;ctx.textAlign="right";ctx.fillStyle="#282825";ctx.font=`600 26px ${F}`;noteLines.forEach(l=>{ctx.fillText(l,W-P,y+20);y+=40});y+=16}
  ctx.textAlign="right";ctx.fillStyle="#6F6A60";ctx.font=`600 22px ${F}`;ctx.fillText(S.settings.rep?`من: ${S.settings.rep}`:"دفتر المندوب",W-P,H-48);
  ctx.textAlign="left";ctx.direction="ltr";ctx.fillText("MESTK",P,H-48);
  return new Promise(r=>cv.toBlob(r,"image/jpeg",0.9))}

function sendSheet(id,isEdit){const o=S.orders.find(x=>x.id===id);const txt=message(o,isEdit);
  const href=`https://wa.me/${S.settings.phone?waNum(S.settings.phone):""}?text=${encodeURIComponent(txt)}`;
  const sh=sheet(S.settings.colleague?`ابعت الطلب لـ ${S.settings.colleague}`:"ابعت الطلب",`<div class="oimg" id="oimg"><span class="hint">بجهز صورة الطلب…</span></div>
    <details><summary class="link" style="cursor:pointer">شوف الرسالة</summary><div class="msg" id="mtxt" style="margin-top:8px">${esc(txt)}</div></details>
    <p class="hint">اختار تبعت الصورة ولا الرسالة. هتفتحلك المشاركة: اختار واتساب وبعدين ${esc(S.settings.colleague||"زميلك")} أو الجروب.</p>`,
    `<div class="btns"><button class="btn wa" id="shr" disabled>ابعت الصورة</button><button class="btn ghost" id="stx">ابعت الرسالة</button></div>
     <div class="btns"><button class="btn ghost" id="cp">انسخ الرسالة</button><button class="btn ghost" id="mk">بعته خلاص ✓</button></div>`);
  const mark=()=>{if(o.status==="draft"){o.status="sent";o.hist.sent=Date.now();save()}};
  const done=()=>{mark();closeSheet();render();toast(`طلب #${o.no} اتعلم إنه اتبعت`)};
  const copy=()=>navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject();
  let file=null;const shr=sh.querySelector("#shr");
  orderImage(o,isEdit).then(blob=>{if(!blob||!sh.isConnected)return;file=new File([blob],`طلب-${o.no}.jpg`,{type:"image/jpeg"});
    $("#oimg").innerHTML=`<img src="${URL.createObjectURL(blob)}" alt="صورة الطلب">`;shr.disabled=false}).catch(()=>{$("#oimg").innerHTML=`<span class="hint">مقدرتش أعمل الصورة، ابعت الرسالة</span>`});
  // the picture alone (no caption), or the text alone: the rep picks one
  shr.onclick=async()=>{if(!file)return;const data={files:[file]};
    if(navigator.canShare&&navigator.canShare(data)){
      try{await navigator.share(data);done()}catch(e){if(e&&e.name!=="AbortError")toast("مقدرتش أفتح المشاركة، جرب «ابعت الرسالة»")}}
    else{// no file sharing here (desktop): save the picture so it can be attached by hand
      const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast("الصورة نزلت، ابعتها من واتساب")}};
  sh.querySelector("#stx").onclick=async()=>{
    if(navigator.share){try{await navigator.share({text:txt});done()}catch(e){if(e&&e.name!=="AbortError"){window.open(href,"_blank","noopener");setTimeout(done,400)}}}
    else{window.open(href,"_blank","noopener");setTimeout(done,400)}};
  sh.querySelector("#mk").onclick=done;
  sh.querySelector("#cp").onclick=()=>{copy().then(()=>toast("اتنسخت"),()=>{const d=sh.querySelector("details");d.open=true;const r=document.createRange();r.selectNodeContents($("#mtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("اتحددت، انسخها")})}}

function orderSheet(id){const o=S.orders.find(x=>x.id===id);const c=cust(o.customerId);const s=STATUSES[SIDX[o.status]];
  const sh=sheet(`طلب #${o.no}`,`<div class="card"><div class="hd"><span class="main"><b>${esc(c.name)}</b><br><span style="color:var(--muted);font-size:13px">${esc(c.owner)} · ${esc(when(o.created))}</span></span><span class="pill st-${o.status}">${s.t}</span></div>

    sh.querySelectorAll("#opay2 [data-pay]").forEach(x=>x.setAttribute("aria-pressed",x===b));toast(o.pay?`اتسجل ${PAY[o.pay]}`:"هتتسأل بعدين");render()};
  sh.querySelector("#osd")?.addEventListener("click",()=>{closeSheet();sendSheet(o.id)});

  const del=sh.querySelector("#odl");del.onclick=()=>{if(del.dataset.armed){S.orders=S.orders.filter(x=>x.id!==o.id);save();closeSheet();toast("اتمسح");render()}else{del.dataset.armed=1;del.textContent="متأكد؟ دوس تاني";del.style.color="var(--bad)"}}}

/* ---------- money sheets ---------- */
function dateField(id,t,label){return `<label class="f">${label||"اليوم"}<input class="inp num" id="${id}" type="date" value="${isoDay(t)}" max="${isoDay(Date.now())}" style="text-align:right;direction:ltr"><span class="hint" id="${id}w">${esc(dayLabel(t))}</span></label>`}
function bindDate(id){const i=$("#"+id);i.oninput=()=>{$("#"+id+"w").textContent=i.value?dayLabel(fromIso(i.value)):""}}
// "امسح" needs a second tap
function armDel(btn,fn){btn.onclick=()=>{if(btn.dataset.armed)fn();else{btn.dataset.armed=1;btn.textContent="متأكد؟ دوس تاني";btn.style.color="var(--bad)"}}}
function collectSheet(cid,payId){const p=payId?S.payments.find(x=>x.id===payId):null;if(p)cid=p.customerId;
  const sh=sheet(p?"تعديل تحصيل":"تحصيل",`${custSelect("pc",cid)}<div id="pbal" class="hint"></div>
    <label class="f">المبلغ<input class="inp num" id="pa" type="number" inputmode="decimal" placeholder="0" value="${p?p.amount:""}" style="text-align:right;direction:rtl"></label>
    ${dateField("pd",p?p.date:Date.now())}
    <label class="f">ملاحظة (اختياري)<input class="inp" id="pn" value="${esc(p?p.note:"")}" placeholder="كاش، تحويل، جزء من الحساب…"></label>`,
    `<button class="btn primary block" id="ps">${p?"احفظ التعديل":"سجّل التحصيل"}</button><button class="btn wa block" id="psh">${p?"احفظ وابعته":"سجّل وابعته للجروب"}</button>${p?`<button class="btn ghost block" id="pdl">امسح التحصيل ده</button>`:""}`);
  const upd=()=>{const c=$("#pc").value;$("#pbal").textContent=c?`عليه دلوقتي ${Math.round(balance(c)).toLocaleString("en-US")} ج`:""};upd();$("#pc").onchange=upd;bindDate("pd");
  const keep=share=>{const c=$("#pc").value,a=parseFloat($("#pa").value);if(!c)return toast("اختار العميل");if(!(a>0))return toast("اكتب المبلغ");
    const d={customerId:c,amount:a,date:fromIso($("#pd").value,p&&p.date),note:$("#pn").value.trim()};
    let x=p;if(x)Object.assign(x,d);else{x={id:uid(),...d};S.payments.push(x)}save();closeSheet();
    toast(p?"اتعدل":`اتسجل ${a.toLocaleString("en-US")} ج · بقى معاك ${Math.round(cashInHand()).toLocaleString("en-US")} ج`);render();
    if(share)shareText(payMessage(x))};
  sh.querySelector("#ps").onclick=()=>keep(false);sh.querySelector("#psh").onclick=()=>keep(true);
  const del=sh.querySelector("#pdl");if(del)armDel(del,()=>{S.payments=S.payments.filter(x=>x!==p);save();closeSheet();toast("اتمسح");render()});
}
function payMessage(p){const c=cust(p.customerId);const b=balance(p.customerId);
  return ["تحصيل",`العميل: ${c.name}${c.owner?` (${c.owner})`:""}`,`المبلغ: ${p.amount.toLocaleString("en-US")} ج`,`اليوم: ${fmtDay(p.date)}`,
    p.note?`ملاحظة: ${p.note}`:null,`الباقي عليه: ${Math.round(Math.max(0,b)).toLocaleString("en-US")} ج`,S.settings.rep?`من: ${S.settings.rep}`:null].filter(Boolean).join("\n")}
// share menu (pick a WhatsApp group or a person); WhatsApp's own picker where sharing isn't available
function shareText(txt){if(navigator.share)navigator.share({text:txt}).catch(()=>{});else window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,"_blank","noopener")}
/* collections counter on Home: counts from the day the rep last zeroed it (today if he never did) */
const colFrom=()=>S.colFrom||sod(Date.now());
function colSheet(){const from=colFrom();const list=S.payments.filter(p=>p.date>=from).sort((a,b)=>b.date-a.date);const sum=list.reduce((a,p)=>a+p.amount,0);
  const sh=sheet(S.colFrom?`حصّلت من ${fmtDay(from)}`:"حصّلت النهارده",`<div class="card"><span class="hint">المجموع</span><div style="font-size:24px;font-weight:800">${money(sum)} ج</div><span class="hint">${list.length} تحصيل · دوس على أي واحد علشان تعدله أو تمسحه</span></div>
    ${list.length?`<div class="list ledger">${list.map(p=>`<button class="row" data-mv="pay:${p.id}"><span class="main"><span class="t">${esc(cust(p.customerId).name)}${p.note?` · ${esc(p.note)}`:""}</span><br><span class="s">${esc(dayLabel(p.date))}</span></span><span class="amt minus">+${money(p.amount)}</span></button>`).join("")}</div>`:`<div class="empty">مفيش تحصيلات من ساعة ما صفّرت</div>`}
    <p class="hint">التصفير بيبدأ العد من الصفر بس. التحصيلات نفسها مش بتتمسح، والفلوس اللي معاك مش بتتغير (دي بتقل لما تسجل «سلّمت للشركة»).</p>`,
    `<button class="btn dark block" id="cz">صفّر العداد</button>${S.colFrom?`<button class="btn ghost block" id="ct">رجّعه لتحصيل النهارده بس</button>`:""}`);
  bindMoves(sh);
  armDel(sh.querySelector("#cz"),()=>{S.colFrom=Date.now();save();closeSheet();toast("العداد اتصفّر");render()});
  sh.querySelector("#ct")?.addEventListener("click",()=>{delete S.colFrom;save();closeSheet();toast("رجع يعد تحصيل النهارده");render()})}
function handoverSheet(hid){const h=hid?S.handovers.find(x=>x.id===hid):null;const cih=Math.max(0,Math.round(cashInHand()));
  const sh=sheet(h?"تعديل تسليم":"سلّمت للشركة",`${h?"":`<div class="card"><span class="hint">معاك دلوقتي</span><div style="font-size:24px;font-weight:800">${money(cih)} ج</div></div>`}
    <label class="f">سلّمت كام؟<input class="inp num" id="ha" type="number" inputmode="decimal" value="${h?h.amount:cih}" style="text-align:right;direction:rtl"></label>
    ${dateField("hd",h?h.date:Date.now())}
    <label class="f">ملاحظة (اختياري)<input class="inp" id="hn" value="${esc(h?h.note:"")}" placeholder="سلمت لمين، رقم الإيصال…"></label>`,
    `<button class="btn primary block" id="hs">${h?"احفظ التعديل":"سجّل التسليم"}</button>${h?`<button class="btn ghost block" id="hdl">امسح التسليم ده</button>`:""}`);
  bindDate("hd");
  sh.querySelector("#hs").onclick=()=>{const a=parseFloat($("#ha").value);if(!(a>0))return toast("اكتب المبلغ");
    const d={amount:a,date:fromIso($("#hd").value,h&&h.date),note:$("#hn").value.trim()};
    if(h)Object.assign(h,d);else S.handovers.push({id:uid(),...d});save();closeSheet();toast(`${h?"اتعدل":"اتسجل"} · الباقي معاك ${Math.round(cashInHand()).toLocaleString("en-US")} ج`);render()};
  const del=sh.querySelector("#hdl");if(del)armDel(del,()=>{S.handovers=S.handovers.filter(x=>x!==h);save();closeSheet();toast("اتمسح");render()})}

/* opening balance: what the customer owed (عليه) or had as credit (ليه) when the rep started, as of a day */
function openingFields(c){const o=c.opening||0;return `<div class="f" style="display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)">رصيد أول المدة (اللي كان عليه أو ليه قبل ما تبدأ)
    <div class="inrow"><div class="seg" id="obs" style="flex:none"><button type="button" data-ob="1" aria-pressed="${o>=0}">عليه</button><button type="button" data-ob="-1" aria-pressed="${o<0}">ليه</button></div>
    <input class="inp num" id="cb" type="number" inputmode="decimal" value="${Math.abs(o)||""}" placeholder="0" style="text-align:right;direction:rtl"></div></div>
    ${dateField("cbd",c.openingDate||S.since||Date.now(),"لحد يوم")}`}
function bindOpening(sh){sh.querySelector("#obs").onclick=e=>{const b=e.target.closest("[data-ob]");if(!b)return;sh.querySelectorAll("[data-ob]").forEach(x=>x.setAttribute("aria-pressed",x===b))};bindDate("cbd")}
function readOpening(sh,c){const sign=sh.querySelector('[data-ob="-1"]').getAttribute("aria-pressed")==="true"?-1:1;
  return {opening:sign*(Math.abs(parseFloat($("#cb").value))||0),openingDate:fromIso($("#cbd").value,c.openingDate)}}
function openingSheet(cid){const c=S.customers.find(x=>x.id===cid);if(!c)return;
  const sh=sheet("رصيد أول المدة",`<p class="hint">${esc(c.name)} · اكتب اللي كان عليه أو ليه قبل ما تسجل طلباته وتحصيلاته هنا. تقدر تغيره في أي وقت.</p>${openingFields(c)}`,
    `<button class="btn primary block" id="obsv">احفظ</button>`);
  bindOpening(sh);sh.querySelector("#obsv").onclick=()=>{Object.assign(c,readOpening(sh,c));save();closeSheet();toast("اتحفظ");render()}}

/* ---------- customers ---------- */
function customerSheet(id){const c=id?S.customers.find(x=>x.id===id):{name:"",owner:"",area:"",phone:"",opening:0};
  const sh=sheet(id?"تعديل عميل":"عميل جديد",`<label class="f">اسم المحل أو الشركة<input class="inp" id="cn" value="${esc(c.name)}"></label>
    <label class="f">اسم المسؤول<input class="inp" id="co" value="${esc(c.owner)}"></label>
    <div class="inrow"><label class="f">المنطقة<input class="inp" id="ca" value="${esc(c.area)}"></label><label class="f">التليفون<input class="inp num" id="cp2" type="tel" value="${esc(c.phone)}" style="text-align:right;direction:ltr"></label></div>
    ${openingFields(c)}`,
    `<button class="btn primary block" id="cs">احفظ</button>`);
  bindOpening(sh);
  sh.querySelector("#cs").onclick=()=>{const n=$("#cn").value.trim();if(!n)return toast("اكتب اسم العميل");
    const d={name:n,owner:$("#co").value.trim(),area:$("#ca").value.trim(),phone:$("#cp2").value.trim(),...readOpening(sh,c)};
    if(id)Object.assign(c,d);else{d.id=uid();S.customers.push(d)}save();closeSheet();toast("اتحفظ");if(!id)go("customer",d.id);else render()}}

/* ---------- backup ---------- */
function backup(outEl){const data=JSON.stringify(S);let ok=false;
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`mandoub-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}
  if(outEl)outEl.innerHTML=`<p class="hint">لو الملف ما نزلش، انسخ النص ده واحفظه:</p><textarea class="inp" readonly style="min-height:70px;font-size:11px;direction:ltr">${esc(data)}</textarea>`;
  S.lastBackup=Date.now();save();toast(ok?"النسخة نزلت في التنزيلات":"اتجهزت النسخة")}
function backupDue(){if(S.demo)return 0;const d=daysSince(S.lastBackup||S.since||Date.now());return d>=3?d:0}
function backupBar(){const d=backupDue();if(!d)return"";
  return `<div class="card" style="border-color:var(--warn);background:var(--warn-soft)"><div class="hd"><span class="main"><b>${S.lastBackup?`آخر نسخة احتياطية من ${d} أيام`:"لسه ما خدتش نسخة احتياطية"}</b><br><span class="s" style="font-size:13px;color:var(--muted)">النسخة بتحمي عملاءك وحساباتك لو حصل حاجة للموبايل. احفظها في Drive أو ابعتها لنفسك واتساب</span></span></div>
  <button class="btn dark block" id="bkNow">خد نسخة دلوقتي</button></div>`}

/* ---------- settings ---------- */
function settingsSheet(){const s=S.settings;
  const sh=sheet("الإعدادات",`<label class="f">اسمك<input class="inp" id="sr" value="${esc(s.rep)}" placeholder="بيظهر في الرسالة وفي التحية"></label>
    <div class="inrow"><label class="f">زميلك اللي بيسجل الطلبات<input class="inp" id="sc" value="${esc(s.colleague)}"></label><label class="f">رقم الواتساب بتاعه<input class="inp num" id="sp" type="tel" value="${esc(s.phone)}" placeholder="01xxxxxxxxx" style="text-align:right;direction:ltr"></label></div>
    <label class="f">لو طلب اتحفظ وما اتبعتش للزميل، يظهرلك بالأحمر في «محتاج تفتكر» بعد<select class="inp" id="srm"><option value="0" ${s.remind==0?"selected":""}>على طول</option><option value="1" ${s.remind==1?"selected":""}>يوم</option><option value="2" ${s.remind==2?"selected":""}>يومين</option></select></label>
    <section class="sec"><h2>البيانات</h2><p class="hint">البيانات محفوظة على الموبايل ده بس. خد نسخة احتياطية كل فترة.</p>
    <div class="btns"><button class="btn ghost" id="sx">نسخة احتياطية</button><label class="btn ghost" style="cursor:pointer">استرجاع نسخة<input type="file" id="si" accept="application/json" hidden></label></div>
    <div id="sxout"></div>
    ${S.demo?`<button class="btn dark block" id="sclr">امسح البيانات التجريبية وابدأ بعملائي</button>`:""}<button class="btn ghost block" id="sdemo">رجّع البيانات التجريبية</button></section>
    <p class="tagline">دفتر المندوب · نسخة تجريبية من MESTK</p>`,`<button class="btn primary block" id="ss">احفظ</button>`);
  sh.querySelector("#ss").onclick=()=>{Object.assign(s,{rep:$("#sr").value.trim(),colleague:$("#sc").value.trim(),phone:$("#sp").value.trim(),remind:+$("#srm").value});save();closeSheet();toast("اتحفظ");render()};
  sh.querySelector("#sx").onclick=()=>backup($("#sxout"));
  sh.querySelector("#si").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.customers||!d.orders)throw 0;S=d;save();closeSheet();toast("اترجعت النسخة");go("home")}catch(err){toast("الملف ده مش نسخة من التطبيق")}};r.readAsText(f)};
  const arm=(btn,fn)=>{btn.onclick=()=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.textContent="متأكد؟ دوس تاني";}}};
  const clr=sh.querySelector("#sclr");if(clr)arm(clr,()=>{S={v:1,demo:false,seq:1,since:Date.now(),lastBackup:0,settings:{...S.settings},products:[],carton:S.carton||{},customers:[],orders:[],requests:[],payments:[],handovers:[]};save();closeSheet();toast("اتمسحت، ضيف أول عميل");go("customers")});
  arm(sh.querySelector("#sdemo"),()=>{const keep={...S.settings};S=seed();S.settings=keep;save();closeSheet();toast("رجعت البيانات التجريبية");go("home")});
}

/* ---------- boot ---------- */
render();loadPhotos();
if("serviceWorker" in navigator&&window.isSecureContext&&window.top===window.self){navigator.serviceWorker.register("sw.js").catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
})();
</script>

</html>
