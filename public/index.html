<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>SalesGo</title>
<meta name="application-name" content="SalesGo">
<meta name="apple-mobile-web-app-title" content="SalesGo">
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.dir="rtl";document.documentElement.lang="ar";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- the font never blocks the first paint: on a slow line the app opens with the system font and switches when Cairo arrives -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom nav + capture button */
/* SalesGo by MESTK design tokens (brand kit 08_Developer/design-tokens). The old names (--fg, --accent, --line…)
   are kept as aliases so every screen picks the brand up. */
:root{
  --bg:#F5F0E7; --surface:#FFFFFF; --raised:#EDE5D9; --text:#282825; --muted:#65615A; --border:#93887A; --divider:#DED5C8;
  --brand:#BD572F; --action:#A74724; --onAction:#FFFFFF;
  --success:#236444; --successBg:#E6F1E8; --warning:#805300; --warningBg:#FFF0C7; --error:#B3262E; --errorBg:#FBE9E8; --info:#245B86; --infoBg:#E6EFF9;
  --brand-soft:#F6E2D8; --wa:#1A8B47;
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:16px; --rb:12px; --rc:10px;
}
:root{--sunk:var(--raised);--line:var(--divider);--fg:var(--text);--accent:var(--action);--accent-ink:var(--onAction);--accent-soft:var(--brand-soft);
  --ok:var(--success);--ok-soft:var(--successBg);--warn:var(--warning);--warn-soft:var(--warningBg);--bad:var(--error);--bad-soft:var(--errorBg);--info-soft:var(--infoBg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1C1A; --surface:#282825; --raised:#34342F; --text:#F5F0E7; --muted:#C6BDB0; --border:#8F877A; --divider:#4A4841;
  --brand:#E07B52; --action:#BD572F; --onAction:#FFFFFF;
  --success:#94D7AA; --successBg:#22382C; --warning:#F2C46D; --warningBg:#3C311D; --error:#FFB3B3; --errorBg:#43262A; --info:#AACDF2; --infoBg:#243445;
  --brand-soft:#45302A; --wa:#2BB566;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1C1A; --surface:#282825; --raised:#34342F; --text:#F5F0E7; --muted:#C6BDB0; --border:#8F877A; --divider:#4A4841;
  --brand:#E07B52; --action:#BD572F; --onAction:#FFFFFF;
  --success:#94D7AA; --successBg:#22382C; --warning:#F2C46D; --warningBg:#3C311D; --error:#FFB3B3; --errorBg:#43262A; --info:#AACDF2; --infoBg:#243445;
  --brand-soft:#45302A; --wa:#2BB566;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.625;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--action);outline-offset:3px}
/* numbers and money read left to right inside the Arabic text, with even-width digits so columns line up */
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top h1{font-size:26px;font-weight:800;margin:0;flex:1;min-width:0;line-height:1.38}
header.top h1 small{display:block;font-size:14px;font-weight:600;color:var(--muted);line-height:1.6}
.iconbtn{width:48px;height:48px;border-radius:var(--rb);border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.brandtile{width:48px;height:48px;border-radius:var(--rb);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;border:0}
.brandtile img{width:30px;height:30px}
main{display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 0}

.demo{font-size:14px;background:var(--warn-soft);color:var(--warn);border-radius:var(--rb);padding:8px 12px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:20px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;line-height:1.5}
.sec h2 .count{font-size:14px;background:var(--sunk);color:var(--muted);border-radius:99px;padding:0 10px;font-weight:700}
.sec h2 a,.sec h2 button.link{margin-inline-start:auto}
.link{background:none;border:0;color:var(--action);font-weight:700;font-size:14px;padding:0 8px;min-height:44px;min-width:44px}

/* hero cash */
.hero{background:var(--surface);color:var(--fg);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero .lbl{font-size:14px;color:var(--muted);font-weight:600}
.hero .big{font-size:26px;font-weight:800;line-height:1.38}
.hero .mid{font-size:19px;font-weight:800;line-height:1.3}
.hero .cur{font-size:14px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.hero .full{grid-column:1/-1;display:flex;gap:8px}
.hero .hcol{background:none;border:0;padding:0;color:inherit;text-align:start}
.hero .full button{flex:1}

/* list rows */
.list{background:var(--surface);border:0;border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start;color:inherit}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;line-height:1.35}
.row .s{font-size:14px;color:var(--muted);line-height:1.57}
.row .end{text-align:end;flex:none}
.row .amt{font-weight:800}
.row.alert{align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}
.avatar{width:44px;height:44px;border-radius:var(--rb);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none;font-size:16px}

.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;white-space:nowrap;line-height:1.6}
.st-draft{background:var(--bad-soft);color:var(--bad)}
.st-sent{background:var(--warn-soft);color:var(--warn)}
.st-registered{background:var(--info-soft);color:var(--info)}
.st-shipped{background:var(--accent-soft);color:var(--accent)}
.st-delivered{background:var(--ok-soft);color:var(--ok)}
.pill.muted{background:var(--sunk);color:var(--muted)}

.btn{border:0;border-radius:var(--rb);padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;text-decoration:none;font-size:16px}
.btn svg{width:24px;height:24px;flex:none}
.btn.primary{background:var(--action);color:var(--onAction)}
.btn.dark{background:var(--surface);border:1px solid var(--border);color:var(--fg)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--fg)}
.btn.onhero{background:var(--surface);color:var(--fg);border:1px solid var(--border)}
.hero .full .btn.onhero:first-child{background:var(--action);color:var(--onAction);border-color:var(--action)}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{min-height:44px;padding:6px 12px;font-size:14px;border-radius:var(--rc)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 0;padding-inline:10px}

/* cards */
.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card .hd{display:flex;align-items:flex-start;gap:10px}
.card .hd .main{flex:1;min-width:0}
.items{font-size:14px;color:var(--muted);margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:0;border-radius:var(--r);padding:12px;min-width:0;color:inherit}
.stat .lbl{font-size:14px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:800;line-height:1.4}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:var(--rc);padding:0 14px;min-height:44px;font-size:14px;font-weight:700;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rb);padding:0 14px;min-height:52px}
.search:focus-within{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.search input{border:0;background:none;flex:1;min-width:0;padding:12px 0;outline:none;font-size:16px}
.search svg{width:24px;height:24px;color:var(--fg)}

.empty{color:var(--muted);text-align:center;padding:20px;font-size:14px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--r)}

/* nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom .in{padding:6px 8px}
nav.bottom button{background:none;border:0;padding:6px 0 8px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);position:relative;border-radius:var(--rb)}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--action);background:var(--brand-soft)}
nav.bottom .badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--action);color:var(--onAction);font-weight:700;font-size:10.5px;border-radius:99px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.fab{position:fixed;z-index:31;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 244px));
  background:var(--action);color:var(--onAction);border:0;border-radius:var(--rb);padding:0 16px;height:48px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(40,40,37,.18);font-size:15px}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet .sh h3{margin:0;font-size:22px;font-weight:800;flex:1;line-height:1.4}
.sheet .sb>*{flex-shrink:0}
.sheet .sb{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.sheet .sf{padding:12px 16px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-height:48px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rb);padding:10px 14px;color:var(--fg);font-weight:600;font-size:16px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--action);box-shadow:0 0 0 1px var(--action);outline:none}
.inp:disabled{background:var(--raised);color:var(--muted)}
.inp[aria-invalid="true"]{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
.inrow{display:flex;gap:8px}.inrow>*{flex:1;min-width:0}
.mic{flex:none!important;width:48px;border-radius:var(--rb);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.mic svg{width:20px;height:20px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:var(--rc);padding:6px 10px;font-weight:700;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* product picker */
.prod{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod .main{flex:1;min-width:0}
.prod.sel{background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper{border:1px solid var(--border);border-radius:var(--rb);background:var(--surface);gap:0}
.stepper button{width:44px;height:44px;border:0;border-radius:var(--rb);background:none;color:var(--fg);font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center}
.stepper button.add{background:none;color:var(--fg)}
.stepper input{width:46px;text-align:center;border:0;background:none;font-weight:800;font-size:18px;padding:0;color:var(--fg);font-variant-numeric:tabular-nums}
.prod{align-items:flex-start}
.prod .t{font-weight:700;line-height:1.4}
.prod .s{color:var(--muted);font-size:13px}
.thumb{width:72px;height:72px;border-radius:var(--rb);border:0;background:#fff;padding:0;overflow:hidden;flex:none}
.thumb img,.pcard img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph,.pcard .ph{width:100%;height:100%;display:grid;place-items:center;color:#9a948a;font-size:12px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.useg{display:flex;gap:6px}
.useg button{min-width:64px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:var(--rc);font-weight:700;font-size:15px;color:var(--fg);padding:0 10px}
.useg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cpick{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)}
.cpbtn{text-align:start;display:block;cursor:pointer;color:var(--fg)}
.cpbtn.empty{color:var(--muted)}
.cppanel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cppanel .list{max-height:300px;overflow-y:auto}
.chip.usual{border-color:var(--accent);color:var(--accent)}
.chip.usual[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.money .lbl{flex:none;font-size:13.5px;font-weight:700;color:var(--muted)}
.money .net{font-size:18px;color:var(--accent)}
.money #odisc,.money #odiscA{padding:8px}
.licgate{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.licgate .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;padding:22px}
.licgate h2{margin:0;font-size:22px}.licgate p{margin:0}
.licgate .brandmark{font-weight:800;font-size:15px;color:var(--accent)}.licgate .brandmark small{margin-inline-start:8px;color:var(--muted);font-size:12px}
.upbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:85;background:var(--action);color:var(--onAction);border:0;border-radius:var(--rb);min-height:48px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:92%}
textarea.note{min-height:150px;font-size:16px;line-height:1.9}
.nrow .main{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.nrow .main>br{display:none}
.nbal{font-size:12.5px;color:var(--muted)}.nbal .neg{color:var(--bad);font-weight:800}
.nask{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;font-weight:800;color:var(--accent)}
.oline+.oline{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.ochips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ochips>span{font-size:12px;font-weight:800;color:var(--muted);min-width:46px}
.ochips .chip{padding:0 12px;font-size:14px}
.ox{margin-inline-start:auto;width:44px;height:44px;border-radius:var(--rc);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800}
.omore{margin-top:10px;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:6px 12px;font-weight:800;font-size:13.5px}
.nask .chip{font-size:14px}
.nerr{background:var(--bad-soft)}.nerr .s{color:var(--bad);font-weight:700}
.bfor{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;font-weight:700;color:var(--accent);width:100%}
.bfor input{flex:1;padding:6px 10px;min-height:44px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.row.more{justify-content:center;font-weight:800;color:var(--accent);font-size:14px}
.prow{padding:0;gap:0}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;text-align:start;color:inherit}
.psend{display:flex;flex-direction:column;gap:4px;padding:6px 10px;border-inline-start:1px solid var(--line);flex:none}
.psend button{min-height:44px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--fg)}
.psend [data-pimg]{background:var(--wa);border-color:var(--wa);color:#fff}
.sendone .btns{margin-top:6px}
.lnote{margin-top:8px;font-size:15px;font-weight:600}
.items small{color:var(--muted);font-size:12.5px}
.per{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.per input{width:72px;min-height:44px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:6px 8px;font-weight:800;text-align:center}
.per.need input{border-color:var(--warn)}
.addbtn{flex:none;min-height:44px;border-radius:var(--rb);border:1px solid var(--action);background:var(--surface);color:var(--action);font-weight:800;padding:0 12px;align-self:center}
.code{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:6px;padding:0 6px;margin-inline-start:4px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:0;border-radius:var(--r);color:inherit;overflow:hidden;padding:0;text-align:start;display:flex;flex-direction:column}
.pcard .im{aspect-ratio:1;background:#fff;border-bottom:1px solid var(--line)}
.pcard .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcard .t{font-weight:700;font-size:14px;line-height:1.4}
.pcard .pr{font-weight:800;color:var(--accent)}

function fromIso(v,orig){if(!v)return orig||Date.now();if(orig&&isoDay(orig)===v)return orig;if(v===isoDay(Date.now()))return Date.now();

/* one WhatsApp message to many customers: a ready message with each customer's name in it, the rep ticks who
   gets it, then sends them one after another (WhatsApp opens on each chat with the text typed; he taps send).
   The queue (S.bcRun) survives closing the app; c.lastMsg remembers when each customer last got one. */
const BC_MSGS=["السلام عليكم يا {الاسم}، عامل ايه؟ في حاجة ناقصاك محتاجها؟",
  "صباح الخير يا {الاسم}، أنا معدّي عليكم الأسبوع ده، لو محتاج حاجة قولي أجهزهالك",
  "يا {الاسم}، فيه بضاعة جديدة نزلت، تحب أبعتلك صورها؟"];
const bcText=(t,c)=>t.split("{الاسم}").join(c.name);
const bcPhone=c=>{const n=waNum(norm(c.phone||""));return n.length>=10?n:""};
const bcLeft=()=>{const r=S.bcRun;return r?r.ids.filter(id=>!r.done.includes(id)&&S.customers.some(c=>c.id===id)).length:0};
const nCust=n=>n===1?"عميل واحد":n<=10?`${n} عملاء`:`${n} عميل`;
// the ready messages, each with a short name; the three built-in ones become the rep's own, to edit or delete
function bcMsgs(){if(!S.settings.msgList){const names=["سلام","معدّي عليكم","بضاعة جديدة"];
  S.settings.msgList=[...BC_MSGS.map((text,i)=>({id:uid(),name:names[i],text})),...(S.settings.msgs||[]).map((text,i)=>({id:uid(),name:`رسالة ${i+4}`,text}))];
  delete S.settings.msgs;save()}return S.settings.msgList}
function bcSheet(){const msgs=bcMsgs();let text=S.settings.lastMsg||msgs[0]?.text||"",cur=(msgs.find(m=>m.text===text)||(S.settings.lastMsg?null:msgs[0]))?.id||null;
  const lastOrder=cid=>S.orders.filter(o=>o.customerId===cid).reduce((m,o)=>Math.max(m,o.created),0);
  const areas=[...new Set(S.customers.map(c=>(c.area||"").trim()).filter(Boolean))];
  const F=[["all","الكل",()=>true],["late","ماطلبوش من أسبوعين",c=>{const t=lastOrder(c.id);return !t||daysSince(t)>=14}],
    ["quiet","ماكلّمتهمش من أسبوع",c=>!c.lastMsg||daysSince(c.lastMsg)>=7],...areas.map(a=>["a:"+a,a,c=>(c.area||"").trim()===a])];
  const list=S.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar"));const pick=new Set();
  const sh=sheet("📣 رسالة لكذا عميل",`<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted)">الرسالة
      <div class="chips" id="bcm"></div>
      <input class="inp" id="bcn" placeholder="اسم الرسالة (مثلًا: سلام)" value="${esc(msgs.find(m=>m.id===cur)?.name||"")}">
      <textarea class="inp" id="bct" rows="3" placeholder="اكتب الرسالة…">${esc(text)}</textarea>
      <span class="hint">اكتب {الاسم} مكان اسم العميل، وهيتغيّر لوحده لكل عميل</span>
      <div class="btns" id="bcact"></div>
      <span class="hint">هتوصل كده:</span><div class="msg" id="bcpv" style="font-weight:500;margin-top:-4px"></div></div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted)">هتتبعت لمين؟
      <div class="chips" id="bcf">${F.map(([k,t])=>`<button type="button" class="chip" data-bf="${esc(k)}">${esc(t)}</button>`).join("")}<button type="button" class="chip" data-bf="none">شيل الكل</button></div></div>
    <div class="list" id="bcl">${list.map(c=>{const ph=bcPhone(c);return `<label class="row" style="cursor:${ph?"pointer":"default"};${ph?"":"opacity:.55"}">
      <input type="checkbox" data-bc="${c.id}" ${ph?"":"disabled"} style="width:22px;height:22px;accent-color:var(--accent);flex:none">
      <span class="main"><span class="t">${esc(c.name)}</span><br><span class="s">${esc([c.area,ph?(c.lastMsg?"آخر رسالة "+when(c.lastMsg):"لسه ما اتبعتلوش"):"مفيش رقم تليفون"].filter(Boolean).join(" · "))}</span></span></label>`}).join("")}</div>`,
    `<button class="btn wa block" id="bcgo" disabled>اختار العملاء</button>`);
  const pv=()=>{text=$("#bct").value;const c=list.find(x=>pick.has(x.id))||list[0];$("#bcpv").textContent=c?bcText(text,c):text};
  const cnt=()=>{const b=$("#bcgo"),n=pick.size;b.disabled=!n;b.textContent=n?`ابعت لـ ${nCust(n)}`:"اختار العملاء";pv()};
  const sync=()=>{sh.querySelectorAll("[data-bc]").forEach(x=>x.checked=pick.has(x.dataset.bc));cnt()};
  const drawM=()=>{$("#bcm").innerHTML=msgs.map(m=>`<button type="button" class="chip" data-bm="${m.id}" aria-pressed="${m.id===cur}">${esc(m.name)}</button>`).join("")
    +`<button type="button" class="chip" data-bm="new" aria-pressed="${!cur}">+ رسالة جديدة</button>`};
  // save / save as new / delete, depending on whether the chosen message was changed
  const acts=()=>{const m=msgs.find(x=>x.id===cur),t=$("#bct").value.trim(),n=$("#bcn").value.trim();
    $("#bcact").innerHTML=!m?(t?`<button type="button" class="btn ghost sm" id="bcadd">احفظها في الرسايل الجاهزة</button>`:"")
      :t!==m.text||(n&&n!==m.name)?`<button type="button" class="btn ghost sm" id="bcupd">احفظ التعديل</button><button type="button" class="btn ghost sm" id="bcadd">احفظها كرسالة جديدة</button>`
      :`<button type="button" class="btn ghost sm" id="bcdel">امسح الرسالة دي</button>`;
    const del=$("#bcdel");if(del)armDel(del,()=>{msgs.splice(msgs.indexOf(m),1);save();cur=msgs[0]?.id||null;
      $("#bct").value=msgs[0]?.text||"";$("#bcn").value=msgs[0]?.name||"";drawM();acts();pv();toast("اتمسحت")})};
  const pickM=id=>{cur=id==="new"?null:id;const m=msgs.find(x=>x.id===cur);$("#bct").value=m?m.text:"";$("#bcn").value=m?m.name:"";drawM();acts();pv();if(!m)$("#bcn").focus()};
  drawM();acts();
  sh.querySelector("#bcm").onclick=e=>{const b=e.target.closest("[data-bm]");if(b)pickM(b.dataset.bm)};
  $("#bct").oninput=$("#bcn").oninput=()=>{acts();pv()};
  sh.querySelector("#bcact").onclick=e=>{const t=$("#bct").value.trim(),n=$("#bcn").value.trim();
    if(e.target.closest("#bcadd")){if(!t)return toast("اكتب الرسالة");const m={id:uid(),name:n||`رسالة ${msgs.length+1}`,text:t};msgs.push(m);cur=m.id;$("#bcn").value=m.name;save();drawM();acts();toast("اتحفظت")}
    if(e.target.closest("#bcupd")){const m=msgs.find(x=>x.id===cur);if(!t)return toast("اكتب الرسالة");m.text=t;if(n)m.name=n;save();drawM();acts();toast("اتعدلت")}};
  sh.querySelector("#bcf").onclick=e=>{const b=e.target.closest("[data-bf]");if(!b)return;const k=b.dataset.bf;
    if(k==="none")pick.clear();else{const f=F.find(x=>x[0]===k);list.forEach(c=>{if(bcPhone(c)&&f[2](c))pick.add(c.id)})}sync()};
  sh.querySelector("#bcl").onchange=e=>{const x=e.target.closest("[data-bc]");if(!x)return;if(x.checked)pick.add(x.dataset.bc);else pick.delete(x.dataset.bc);cnt()};
  pv();
  sh.querySelector("#bcgo").onclick=()=>{const t=$("#bct").value.trim();if(!t)return toast("اكتب الرسالة");
    S.settings.lastMsg=t;S.bcRun={text:t,ids:list.filter(c=>pick.has(c.id)).map(c=>c.id),done:[],sent:[],at:Date.now()};save();bcRun()}}
function bcRun(){const r=S.bcRun;if(!r)return;
  const ids=r.ids.filter(id=>S.customers.some(c=>c.id===id)),next=ids.find(id=>!r.done.includes(id)),c=next&&S.customers.find(x=>x.id===next);
  const left=ids.filter(id=>!r.done.includes(id)).length,sent=ids.filter(id=>(r.sent||[]).includes(id)).length,skipped=ids.length-left-sent;
  const href=c?`https://wa.me/${bcPhone(c)}?text=${encodeURIComponent(bcText(r.text,c))}`:"";
  const sh=sheet("📣 الرسايل",`<div class="card"><div class="total"><span>اتبعت</span><span><span class="num">${sent}</span> من <span class="num">${ids.length}</span></span></div>
      <div class="bcbar"><i style="width:${ids.length?Math.round((ids.length-left)/ids.length*100):0}%"></i></div>${skipped?`<span class="hint">فوّت ${skipped}</span>`:""}</div>
    ${c?`<div class="card"><span class="hint">اللي عليه الدور</span><div style="font-size:19px;font-weight:800">${esc(c.name)}</div><div class="msg" style="margin-top:8px">${esc(bcText(r.text,c))}</div></div>
      <p class="hint">دوس «ابعت» هيفتح الواتساب على الشات والرسالة مكتوبة، دوس إرسال وارجع هنا تلاقي اللي بعده.</p>`
      :`<div class="empty">خلصت ✓ الرسالة اتبعتت لكل اللي اخترتهم</div>`}
    <div class="list">${ids.map(id=>{const x=S.customers.find(y=>y.id===id);const ok=r.done.includes(id);
      return `<div class="row"><span class="main t" style="${ok?"color:var(--muted)":""}">${esc(x.name)}</span><span class="pill ${ok&&(r.sent||[]).includes(id)?"ok":"muted"}">${ok?((r.sent||[]).includes(id)?"اتبعت ✓":"فوّته"):id===next?"عليه الدور":"لسه"}</span></div>`}).join("")}</div>`,
    c?`<a class="btn wa block" id="bcsend" href="${esc(href)}" target="_blank" rel="noopener">ابعت لـ ${esc(c.name)}</a>
      <div class="btns"><button class="btn ghost" id="bcskip">فوّته</button><button class="btn ghost" id="bcstop">وقّف</button></div>`
     :`<button class="btn primary block" id="bcend">تمام</button>`);
  const mark=ok=>{r.done.push(c.id);if(ok){(r.sent=r.sent||[]).push(c.id);c.lastMsg=Date.now()}save();render();bcRun()};
  sh.querySelector("#bcsend")?.addEventListener("click",()=>setTimeout(()=>mark(true),400));
  sh.querySelector("#bcskip")?.addEventListener("click",()=>mark(false));
  sh.querySelector("#bcstop")?.addEventListener("click",()=>{closeSheet();toast(`وقفت · تقدر تكمّل من صفحة العملاء`)});
  sh.querySelector("#bcend")?.addEventListener("click",()=>{delete S.bcRun;save();closeSheet();render()})}

function orderCard(o){const s=STATUSES[SIDX[o.status]];const c=cust(o.customerId);
  return `<div class="card" data-o="${o.id}"><div class="hd"><span class="main"><b>${esc(c.name)}</b><br><span class="s" style="color:var(--muted);font-size:13px">#<span class="num">${o.no}</span> · ${esc(when(o.created))}</span></span>
  <span class="pill st-${o.status}">${s.t}</span></div>
  <div class="steps">${STATUSES.slice(1).map((x,i)=>`<i class="${SIDX[o.status]>i?"on":""}"></i>`).join("")}</div>
  <ul class="items">${o.items.slice(0,3).map(i=>`<li><span>${esc(itemName(i))}${itemTags(i)?` · <b>${esc(itemTags(i))}</b>`:""}${i.note?`<br><small>${esc(i.note)}</small>`:""}</span><span style="flex:none"><span class="num">${i.qty}</span> ${unitName(i)}</span></li>`).join("")}${o.items.length>3?`<li><span>و ${o.items.length-3} أصناف كمان</span></li>`:""}</ul>
  ${s.next?`<div class="btns">${o.status==="draft"?`<button class="btn wa sm" data-send="${o.id}">ابعته واتساب</button>`:`<button class="btn ghost sm" data-adv="${o.id}">${s.next} ✓</button>`}</div>`:""}</div>`}
// one line per order on Home: customer, number, when, status
function orderRow(o){const s=STATUSES[SIDX[o.status]];return `<button class="row" data-o="${o.id}"><span class="main"><span class="t">${esc(cust(o.customerId).name)}</span><br>
  <span class="s">#<span class="num">${o.no}</span> · ${esc(when(o.created))} · ${o.items.length} صنف</span></span><span class="pill st-${o.status}">${s.t}</span></button>`}
function bindOrderCards(v){
  v.querySelectorAll("[data-send]").forEach(b=>b.onclick=e=>{e.stopPropagation();sendSheet(b.dataset.send)});
  v.querySelectorAll("[data-adv]").forEach(b=>b.onclick=e=>{e.stopPropagation();advance(b.dataset.adv)});
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>orderSheet(b.dataset.o))}
function advance(id){const o=S.orders.find(x=>x.id===id);const i=SIDX[o.status];if(i>=4)return;const nk=STATUSES[i+1].k;o.status=nk;o.hist[nk]=Date.now();save();
  toast(`طلب #${o.no}: ${STATUSES[i+1].t}`);render()}

function vOrders(v){
  setTitle("الطلبات");
  const groups=[["open","المفتوحة",o=>o.status!=="delivered"],["draft","ما اتبعتش",o=>o.status==="draft"],["sent","مستني تسجيل",o=>o.status==="sent"],["moving","في الطريق",o=>o.status==="registered"||o.status==="shipped"],["delivered","اتسلمت",o=>o.status==="delivered"]];

function bindMoves(v){v.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.mv.split(":");

function reqRow(r){return `<button class="row alert" data-r="${r.id}"><span class="dot info"></span><span class="main"><span class="t">${esc(cust(r.customerId).name)}</span><br><span class="s">${esc(r.text)} · ${esc(when(r.created))}</span></span></button>`}

/* one day's collections (the rep's «دفعات» note): list, total, and a picture or text for the colleague */

const oldTag=p=>p.forDate?`قديمة · عن يوم ${fmtDay(p.forDate)}`:"";
const payNote=p=>[oldTag(p),p.note].filter(Boolean).join(" · ");
function dayColSection(){const list=dayPays(filt.dcDay),sum=list.reduce((a,p)=>a+p.amount,0),d=fromIso(filt.dcDay);

  return `<section class="sec" id="dcSec"><h2>تحصيلات يوم <span class="count">${esc(daysSince(d)===0?"النهارده":daysSince(d)===1?"امبارح":fmtDay(d))}</span></h2>
    <div class="chips" style="margin-bottom:10px">${dchip(today,"النهارده")}${dchip(yest,"امبارح")}

    ${list.length?`<div class="list ledger">${old.length?sub("دفعات اليوم",neu):""}${rows(neu)}${old.length?sub("دفعات قديمة",old)+rows(old):""}

/* «النوتة»: the rep writes collections like in his phone notes, one per line: «محمد 500», «سيد 2 ألف قديمة».
   Each line is read live into name + amount + note; the name is matched to a customer (or asks which one when it's
   close to several, or becomes a new customer). The text is kept as a draft until saved. */
function parseNoteLine(raw){
  let l=raw.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/٬/g,",").replace(/٫/g,".")
    .replace(/^\s*(?:[-•*·]+|\d{1,2}\s*[-.)]\s+)\s*/,"").trim();
  const clean=x=>x.replace(/^[\s:=\-–—،,.]+|[\s:=\-–—،,.]+$/g,"").trim();
  let amount=0,before=l,after="";
  const m=l.match(/(\d[\d,]*(?:\.\d+)?)\s*(آلاف|الاف|ألف|الف)?/);
  if(m){amount=parseFloat(m[1].replace(/,/g,""))*(m[2]?1000:1);before=l.slice(0,m.index);after=l.slice(m.index+m[0].length)}
  else{const w=l.match(/(^|\s)(ألفين|الفين|ألف|الف)(?=\s|$)/);if(w){amount=/ين$/.test(w[2])?2000:1000;before=l.slice(0,w.index);after=l.slice(w.index+w[0].length)}}
  after=after.replace(/^\s*(جنيهات|جنيه|جنية|ج\.?م|ج)(?=\s|$|[،,.])/,"");
  let name=clean(before),note=clean(after);if(!name&&amount){name=note;note=""}
  const old=/قديم|اللي فات|الي فات/.test(note);if(/^(دفعه |دفعة )?قديم(ه|ة)?$/.test(note))note="";
  return {raw:raw.trim(),name,amount,note,old,err:!name?"اكتب اسم العميل":!(amount>0)?"اكتب المبلغ":""}}
function matchCust(name){const n=norm(name).replace(/\s+/g," ").trim();const cn=c=>norm(c.name).replace(/\s+/g," ").trim();
  const ex=S.customers.filter(c=>cn(c)===n);if(ex.length===1)return {c:ex[0],cands:[]};
  if(ex.length)return {cands:ex};
  return {cands:n.length<2?[]:S.customers.filter(c=>{const x=cn(c);return x.length>1&&(x.includes(n)||n.includes(x))}).slice(0,4)}}
function noteSheet(iso){const dr=S.noteDraft||{};iso=iso||dr.day||isoDay(Date.now());
  const pick={},oldFor={};// pick[normalised name] = customer id or "new"; oldFor[line] = iso day it settles
  const sh=sheet("📝 النوتة",`${dateField("nday",fromIso(iso),"اليوم اللي اتقبضت فيه الفلوس")}
    <label class="f">اكتب كل عميل في سطر: الاسم والمبلغ
      <textarea class="inp note" id="nt" rows="6" placeholder="محمد علي 500&#10;الحاج سيد 2 ألف&#10;معرض النور 1500 قديمة" autocomplete="off">${esc(dr.t||"")}</textarea></label>
    <p class="hint">ممكن تكتب ملحوظة بعد المبلغ (تحويل، باقي الحساب…). ولو الدفعة عن حساب قديم اكتب جنبها «قديمة».</p>
    <div id="npv"></div>`,
    `<div class="total"><span>المجموع</span><span><span class="num" id="nsum">0</span> ج</span></div><button class="btn primary block" id="nsave">احفظ</button>`);
  bindDate("nday");const ta=sh.querySelector("#nt");
  const lines=()=>ta.value.split("\n").map(parseNoteLine).filter(x=>x.raw).map(x=>{const k=norm(x.name).replace(/\s+/g," ").trim();
    const m=x.name?matchCust(x.name):{cands:[]};const p=pick[k];
    const c=p&&p!=="new"?S.customers.find(y=>y.id===p):m.c;return {...x,k,c,isNew:p==="new"||(!c&&!m.cands.length),cands:c||p?[]:m.cands}});
  const draw=()=>{const ls=lines();const ok=ls.filter(x=>!x.err);
    // what the customer owes before and after this line (several lines for one customer add up)
    const run={};ok.forEach(x=>{if(!x.c)return;const b=x.c.id in run?run[x.c.id]:balance(x.c.id);run[x.c.id]=b-x.amount;if(b>0)x.bal=[b,b-x.amount]});
    $("#nsum").textContent=ok.reduce((a,x)=>a+x.amount,0).toLocaleString("en-US");
    sh.querySelector("#nsave").textContent=ok.length?`احفظ ${ok.length} دفعة`:"احفظ";
    $("#npv").innerHTML=ls.length?`<div class="list ledger">${ls.map(x=>x.err?`<div class="row nerr"><span class="main"><span class="t">${esc(x.raw)}</span><br><span class="s">${x.err}</span></span></div>`
      :`<div class="row nrow"><span class="main"><span class="t">${esc(x.c?x.c.name:x.name)}${x.c?` <span class="pill ok">✓</span>`:x.isNew?` <span class="pill warn">عميل جديد</span>`:""}</span>

        ${x.old?`<label class="bfor">دفعة قديمة عن يوم <input class="inp num" type="date" data-nf="${esc(x.raw)}" value="${oldFor[x.raw]||(oldFor[x.raw]=isoDay(fromIso($("#nday").value||iso)-7*DAY))}" max="${isoDay(Date.now())}" style="direction:ltr"></label>`:""}</span>

      :`<div class="empty">اللي هتكتبه هيظهر هنا: كل عميل والمبلغ، علشان تتأكد قبل ما تحفظ</div>`};
  // the draft is saved half a second after typing stops, even if the sheet was closed meanwhile
  const dayEl=sh.querySelector("#nday");let dt;ta.addEventListener("input",()=>{draw();clearTimeout(dt);dt=setTimeout(()=>{if(ta.value.trim())S.noteDraft={t:ta.value,day:dayEl.value};else delete S.noteDraft;save()},500)});
  sh.addEventListener("change",e=>{const f=e.target.closest("[data-nf]");if(f)oldFor[f.dataset.nf]=f.value;
    if(e.target.id==="nday"&&S.noteDraft){S.noteDraft.day=e.target.value;save()}});
  sh.addEventListener("click",e=>{const b=e.target.closest("[data-np]");if(!b)return;const [k,v]=b.dataset.np.split("|");pick[k]=v;draw()});
  draw();if(!ta.value)setTimeout(()=>ta.focus(),50);
  sh.querySelector("#nsave").onclick=()=>{const ls=lines();if(!ls.length)return toast("اكتب اسم ومبلغ واحد على الأقل");
    if(ls.some(x=>x.err))return toast("فيه سطر ناقص اسم أو مبلغ، صلّحه أو امسحه");
    if(ls.some(x=>x.cands.length))return toast("اختار العميل في السطور اللي مكتوب فيها «تقصد مين؟»");
    const day=$("#nday").value||iso,made={},ids=[];let added=0;
    ls.forEach(x=>{let c=x.c;if(!c){c=made[x.k];if(!c){c=made[x.k]={id:uid(),name:x.name,owner:"",area:"",phone:"",opening:0};S.customers.push(c);added++}}
      const p={id:uid(),customerId:c.id,amount:x.amount,date:fromIso(day),note:x.note};if(x.old)p.forDate=fromIso(oldFor[x.raw]||isoDay(fromIso(day)-7*DAY));
      S.payments.push(p);ids.push(p.id)});
    delete S.noteDraft;filt.dcDay=day;save();render();noteDone(ids,day,added)}}

/* ---------- catalog browsing ---------- */
filt.co=CAT.companies[0]?.id||"";filt.pcat="الكل";filt.pq="";
// photos live in catalog-img.js, loaded after the app opens; until then a placeholder holds the spot
// the rep's own photos ("u:key") live in IndexedDB and are read into UIMG when the app opens
const UIMG={};
const imgSrc=k=>!k?null:k.startsWith("u:")?UIMG[k.slice(2)]||null:self.CATIMG?self.CATIMG[k]||null:null;
const photo=p=>p&&imgSrc(p.img);
const imgHTML=p=>{const src=photo(p);return src?`<img src="${src}" alt="" decoding="async">`:p&&p.img?`<span class="ph" data-ph="${esc(p.img)}">…</span>`:`<span class="ph">مفيش صورة</span>`};
const fillPhotos=()=>document.querySelectorAll("[data-ph]").forEach(el=>{const src=imgSrc(el.dataset.ph);if(src)el.outerHTML=`<img src="${src}" alt="" decoding="async">`});
function loadPhotos(){const sc=document.createElement("script");sc.src="catalog-img.js";sc.onload=fillPhotos;document.body.appendChild(sc);
  imgAll().then(o=>{Object.assign(UIMG,o);fillPhotos()}).catch(()=>{})}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("mandoub-img",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function imgPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("img","readwrite"),st=t.objectStore("img");
  if(v==null)st.delete(k);else st.put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function imgAll(){const db=await idb();return new Promise((res,rej)=>{const out={},c=db.transaction("img").objectStore("img").openCursor();
  c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
const myImgKeys=()=>Object.values(PMAP).map(p=>p.img).filter(k=>k&&k.startsWith("u:")&&UIMG[k.slice(2)]).map(k=>k.slice(2));
function dropImg(k){if(k&&k.startsWith("u:")){delete UIMG[k.slice(2)];imgPut(k.slice(2),null).catch(()=>{})}}
// a photo from the camera or gallery, made small like the price-list photos (~360px)
async function shrinkPhoto(file){const url=URL.createObjectURL(file);try{const im=await loadImg(url);if(!im)throw 0;const s=Math.min(1,360/Math.max(im.width,im.height));
  const cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);const c=cv.getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height);
  let d=cv.toDataURL("image/webp",.8);if(!d.startsWith("data:image/webp"))d=cv.toDataURL("image/jpeg",.82);return d}finally{URL.revokeObjectURL(url)}}

/* add or edit a product: photo, name, company (or a new one), category, price, code, pieces per carton.
   A list product keeps only what changed and can be hidden or put back as it was; the rep's own can be deleted. */
function productSheet(pid,opts){opts=opts||{};const p=pid?PMAP[pid]:null,base=p&&!p.mine?BASE.products.find(x=>x.id===pid):null;
  let img=p?p.img||"":"",pic=null,co=p?p.co:(CAT.companies.some(c=>c.id===filt.co)?filt.co:CAT.companies[0]?.id);
  const catsOf2=c=>[...new Set(Object.values(PMAP).filter(x=>x.co===c).map(x=>x.cat).filter(Boolean))];
  const sh=sheet(p?"تعديل منتج":"منتج جديد",`<div class="pedit"><div class="im" id="peim">${p&&photo(p)?imgHTML(p):`<span class="ph">مفيش صورة</span>`}</div>
      <div class="pbtns"><label class="btn ghost sm" style="cursor:pointer">📷 ${p&&p.img?"غيّر الصورة":"ضيف صورة"}<input type="file" id="pef" accept="image/*" hidden></label>
      <button type="button" class="link" id="pex" ${img?"":"hidden"}>شيل الصورة</button></div></div>
    <label class="f">اسم المنتج<input class="inp" id="pen" value="${esc(p?p.name:opts.name||"")}" placeholder="مثلًا: كشاف 100 وات ابيض"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted)">الشركة
      <div class="chips" id="peco">${ALLCOS.map(c=>`<button type="button" class="chip" data-pco="${c.id}" aria-pressed="${c.id===co}">${esc(c.name)}</button>`).join("")}<button type="button" class="chip" data-pco="new" aria-pressed="false">+ شركة جديدة</button></div>
      <input class="inp" id="penco" placeholder="اسم الشركة الجديدة" hidden></div>
    <label class="f">القسم<input class="inp" id="pec" list="pecl" value="${esc(p?p.cat:"")}" placeholder="كشافات، لمبات، بلاكات…" autocomplete="off"><datalist id="pecl"></datalist></label>
    ${["col","lt"].map(k=>`<div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)">${k==="col"?"الألوان المتاحة":"الإضاءة المتاحة"}
      <span class="hint" style="font-weight:500">${k==="col"?"علّم على الألوان اللي المنتج بييجي بيها":"لو المنتج مفيهوش لمبة سيبها فاضية"}</span>
      <div class="ochips" id="pe${k}"></div>
      <div class="inrow" id="pe${k}Box" hidden><input class="inp" id="pe${k}In" placeholder="${k==="col"?"اسم اللون":"نوع الإضاءة"}"><button type="button" class="btn dark" data-pcok="${k}" style="flex:none">ضيف</button></div></div>`).join("")}
    <div class="inrow"><label class="f">السعر للقطعة<input class="inp num" id="pep" type="number" inputmode="decimal" value="${p&&p.price?p.price:""}" placeholder="0" style="text-align:right;direction:rtl"></label>
      <label class="f">الكود (اختياري)<input class="inp" id="pecode" value="${esc(p?p.code||"":"")}" style="direction:ltr;text-align:right"></label></div>
    ${base?`<p class="hint">في ليستة الشركة: ${esc(base.name)} · ${money(base.price)} ج</p>`:""}
    <label class="f">الكرتونة فيها كام قطعة (اختياري)<input class="inp num" id="pecar" type="number" inputmode="numeric" value="${pid&&S.carton[pid]||""}" style="text-align:right;direction:rtl"></label>`,
    `<button class="btn primary block" id="pesv">${p?"احفظ":"ضيف المنتج"}</button>
     ${p?`<div class="btns">${p.mine?`<button class="btn ghost" id="pedl">امسح المنتج ده</button>`:`<button class="btn ghost" id="pehd">اخفيه من القايمة</button>${p.edited?`<button class="btn ghost" id="pert">رجّعه زي الأصل</button>`:""}`}</div>`:""}`,{stack:opts.stack});
  const opt={col:new Set(p&&p.colors||[]),lt:new Set(p&&p.lights||[])},DEF={col:BODY,lt:LIGHT};
  const drawOpt=k=>{$("#pe"+k).innerHTML=[...new Set([...DEF[k],...opt[k]])].map(c=>`<button type="button" class="chip" data-pc="${k}|${esc(c)}" aria-pressed="${opt[k].has(c)}">${esc(c)}</button>`).join("")
    +`<button type="button" class="chip" data-pcadd="${k}">${k==="col"?"+ لون تاني":"+ إضاءة تانية"}</button>`};drawOpt("col");drawOpt("lt");
  sh.addEventListener("click",e=>{const c=e.target.closest("[data-pc]"),a=e.target.closest("[data-pcadd]"),ok=e.target.closest("[data-pcok]");
    if(c){const [k,v]=c.dataset.pc.split("|");if(opt[k].has(v))opt[k].delete(v);else opt[k].add(v);drawOpt(k)}
    if(a){const k=a.dataset.pcadd;$(`#pe${k}Box`).hidden=false;$(`#pe${k}In`).focus()}
    if(ok){const k=ok.dataset.pcok,v=$(`#pe${k}In`).value.trim();if(!v)return;opt[k].add(v);$(`#pe${k}In`).value="";$(`#pe${k}Box`).hidden=true;drawOpt(k)}});
  const cats=()=>{$("#pecl").innerHTML=(co&&co!=="new"?catsOf2(co):[]).map(c=>`<option value="${esc(c)}">`).join("")};cats();
  sh.querySelector("#peco").onclick=e=>{const b=e.target.closest("[data-pco]");if(!b)return;co=b.dataset.pco;
    sh.querySelectorAll("[data-pco]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#penco").hidden=co!=="new";if(co==="new")$("#penco").focus();cats()};
  const show=()=>{const src=pic||imgSrc(img);$("#peim").innerHTML=src?`<img src="${src}" alt="">`:`<span class="ph">مفيش صورة</span>`;$("#pex").hidden=!src};
  sh.querySelector("#pef").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("#peim").innerHTML=`<span class="ph">بجهز الصورة…</span>`;
    try{pic=await shrinkPhoto(f)}catch(err){toast("مقدرتش أفتح الصورة دي")}show()};
  sh.querySelector("#pex").onclick=()=>{pic=null;img="";show()};
  const done=(msg,id)=>{save();rebuildCat(S.cat);closeSheet();toast(msg);document.dispatchEvent(new CustomEvent("catchange"));render();if(id&&opts.onSave&&PMAP[id])opts.onSave(PMAP[id])};
  sh.querySelector("#pesv").onclick=async()=>{const name=$("#pen").value.trim();if(!name)return toast("اكتب اسم المنتج");
    S.cat=S.cat||{};let c=co;
    if(c==="new"){const n=$("#penco").value.trim();if(!n)return toast("اكتب اسم الشركة");
      const ex=ALLCOS.find(x=>norm(x.name)===norm(n));if(ex)c=ex.id;else{c="c_"+uid();(S.cat.cos=S.cat.cos||[]).push({id:c,name:n})}}
    if(!c)return toast("اختار الشركة");
    const old=p?p.img||"":"";
    if(pic){const k=uid()+Date.now().toString(36);try{await imgPut(k,pic);UIMG[k]=pic;img="u:"+k}catch(err){toast("مقدرتش أحفظ الصورة على الموبايل ده")}}
    if(old!==img)dropImg(old);
    const d={name,co:c,cat:$("#pec").value.trim()||"تانية",code:$("#pecode").value.trim(),price:Math.max(0,parseFloat($("#pep").value)||0),img};
    // nothing ticked means "not set": the order then offers the usual colours and lights
    const set=opt.col.size||opt.lt.size;d.colors=set?[...opt.col]:undefined;d.lights=set?[...opt.lt]:undefined;
    let id=pid;
    if(!p){id="u_"+uid();(S.cat.add=S.cat.add||[]).push({id,...d})}
    else if(p.mine){const x=S.cat.add.find(y=>y.id===pid);Object.assign(x,d);if(!set){delete x.colors;delete x.lights}}
    else{const diff={};["name","co","cat","code","price","img"].forEach(k=>{if(d[k]!==(base[k]??(k==="price"?0:"")))diff[k]=d[k]});
      if(set){diff.colors=d.colors;diff.lights=d.lights}
      S.cat.edit=S.cat.edit||{};if(Object.keys(diff).length)S.cat.edit[pid]=diff;else delete S.cat.edit[pid]}
    const n=parseInt($("#pecar").value)||0;if(n>0)S.carton[id]=n;else delete S.carton[id];
    if(!p)filt.co=c;
    done(p?"اتعدل":`اتضاف «${name}»`,id)};
  const dl=sh.querySelector("#pedl");if(dl)armDel(dl,()=>{dropImg(p.img);S.cat.add=S.cat.add.filter(x=>x.id!==pid);delete S.carton[pid];done("اتمسح")});
  const hd=sh.querySelector("#pehd");if(hd)armDel(hd,()=>{S.cat=S.cat||{};S.cat.edit=S.cat.edit||{};S.cat.edit[pid]={...(S.cat.edit[pid]||{}),hide:true};done("اتخفى · ترجّعه من «منتجات مخفية» تحت القايمة")});
  const rt=sh.querySelector("#pert");if(rt)armDel(rt,()=>{dropImg(S.cat.edit[pid].img);delete S.cat.edit[pid];done("رجع زي الأصل",pid)})}
function hiddenSheet(){const sh=sheet("منتجات مخفية",`<p class="hint">دي منتجات من ليستة الشركة انت خفيتها. مش بتظهر في الطلب ولا في البحث.</p>
  <div class="list">${HIDDEN.map(p=>`<div class="row"><span class="main"><span class="t">${esc(p.name)}</span><br><span class="s">${esc(coName(p.co))} · ${esc(p.cat||"")}</span></span><button class="btn ghost sm" data-unh="${p.id}">رجّعه</button></div>`).join("")||`<div class="empty">مفيش منتجات مخفية</div>`}</div>`);
  sh.addEventListener("click",e=>{const b=e.target.closest("[data-unh]");if(!b)return;const id=b.dataset.unh,e2=S.cat.edit[id];delete e2.hide;if(!Object.keys(e2).length)delete S.cat.edit[id];
    save();rebuildCat(S.cat);render();b.closest(".row").remove();toast("رجع للقايمة")})}
const priceTxt=p=>p.price?`${money(p.price)} ج للقطعة`:"من غير سعر";
// colours named in the product name (e.g. "ابيض/اسود") become quick picks on the order line
// every order line can say the body colour and the light colour; one product can be ordered in several of them
const BODY=["ابيض","اسود","دهبي","ابيض في اسود"],LIGHT=["ابيض","ورم"];
const itemTags=i=>[i.color&&`اللون: ${i.color}`,i.light&&`الإضاءة: ${i.light}`].filter(Boolean).join(" · ");
// search ignores the company and category tabs, so a name typed anywhere is found
function findProducts(co,cat,q){q=(q||"").trim();// co "" = all companies
  if(q){const ws=q.split(/\s+/);return CAT.products.filter(p=>ws.every(w=>has(p.name+" "+(p.code||"")+" "+coName(p.co),w)))}
  return CAT.products.filter(p=>(!co||p.co===co)&&(cat==="الكل"||p.cat===cat))}
const catsOf=co=>["الكل",...new Set(CAT.products.filter(p=>!co||p.co===co).map(p=>p.cat))];
function coSeg(id,extra){return `<div class="seg" id="${id}">${CAT.companies.map(c=>`<button data-co="${c.id}" aria-pressed="${c.id===filt.co}">${esc(c.name)}</button>`).join("")}${extra||""}</div>`}
const searchBox=(id,ph,val)=>`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="${id}" placeholder="${ph}" value="${esc(val||"")}" autocomplete="off" enterkeyhint="search"></div>`;

function lightbox(pid,withOrder){const p=prod(pid);if(!p)return;$(".lightbox")?.remove();
  const el=document.createElement("div");el.className="lightbox";el.setAttribute("role","dialog");el.setAttribute("aria-label",p.name);
  el.innerHTML=`<div class="im">${imgHTML(p)}</div><div class="cap">${esc(p.name)}${p.code?` <span class="code">${esc(p.code)}</span>`:""}<br><span class="s">${esc(coName(p.co))} · ${priceTxt(p)}</span></div>
    <div class="btns">${withOrder?`<button class="btn primary" id="lbo">ضيفه لطلب</button>`:""}<button class="btn ghost" id="lbe">تعديل</button><button class="btn ghost" id="lbx">رجوع</button></div>`;
  el.addEventListener("click",e=>{if(e.target===el||e.target.closest("#lbx"))el.remove()});
  document.body.appendChild(el);
  el.querySelector("#lbo")?.addEventListener("click",()=>{el.remove();orderEditor({items:[{pid,qty:1,unit:"ق"}]})});
  el.querySelector("#lbe").addEventListener("click",()=>{el.remove();productSheet(pid,{stack:!!$("#scrim")})})}

function vProducts(v){
  setTitle("المنتجات",`${CAT.products.length} منتج من ${CAT.companies.length} شركات`);
  if(!CAT.companies.some(c=>c.id===filt.co))filt.co=CAT.companies[0]?.id||"";
  v.innerHTML=`${coSeg("vco")}<div class="inrow">${searchBox("vq","دوّر باسم المنتج أو الكود",filt.pq)}<button class="btn primary" id="vadd" style="flex:none">+ منتج</button></div><div class="chips" id="vcats"></div><div id="vlist"></div>
    ${HIDDEN.length?`<button class="link" id="vhid" style="margin-top:12px">منتجات مخفية (${HIDDEN.length})</button>`:""}`;
  $("#vadd").onclick=()=>productSheet();const vh=$("#vhid");if(vh)vh.onclick=hiddenSheet;
  const draw=()=>{const q=filt.pq.trim();const co=CAT.companies.find(c=>c.id===filt.co);
    v.querySelectorAll("[data-co]").forEach(b=>b.setAttribute("aria-pressed",!q&&b.dataset.co===filt.co));
    $("#vcats").hidden=!!q;
    $("#vcats").innerHTML=catsOf(filt.co).map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===filt.pcat}">${esc(c)}</button>`).join("");
    const list=findProducts(filt.co,filt.pcat,q);
    $("#vlist").innerHTML=(list.length?`<div class="grid">${list.map(p=>`<button class="pcard" data-pz="${p.id}"><div class="im">${imgHTML(p)}</div><div class="b"><span class="t">${esc(p.name)}</span>
      <span class="s" style="font-size:12.5px;color:var(--muted)">${q?esc(coName(p.co))+" · ":""}${p.code?esc(p.code):esc(p.cat)}</span><span class="pr">${p.price?money(p.price)+" ج":"—"}</span>${p.mine?`<span class="ptag">مضاف منك</span>`:p.edited?`<span class="ptag">معدّل</span>`:""}</div></button>`).join("")}</div>`
      :`<div class="empty">مفيش منتج بالاسم ده</div>`)+(!q&&co&&co.note?`<p class="hint" style="margin-top:10px">${esc(co.name)}: ${esc(co.note)}</p>`:"")};
  draw();
  v.onclick=e=>{const c=e.target.closest("[data-co]"),k=e.target.closest("[data-cat]"),z=e.target.closest("[data-pz]");
    if(c){filt.co=c.dataset.co;filt.pcat="الكل";filt.pq="";$("#vq").value="";draw()}
    if(k){filt.pcat=k.dataset.cat;draw()}
    if(z)lightbox(z.dataset.pz,true)};
  $("#vq").oninput=e=>{filt.pq=e.target.value;draw()};
}

/* ---------- order editor ---------- */
function orderEditor(init){
  init=init||{};const editing=init.id?S.orders.find(o=>o.id===init.id):null;
  const src=editing?editing.items:init.items||[];
  // sel[pid] = {per: pieces per carton, ls: [{n: count, u: "ق" piece | "ك" carton, color, light, note}]}: one line per colour
  const sel={},newL=n=>({n:n||0,u:"ق",color:"",light:"",note:""});
  src.forEach(i=>{if(!i.pid)return;const x=sel[i.pid]=sel[i.pid]||{per:i.per||S.carton[i.pid]||0,ls:[]};
    x.ls.push({n:i.qty,u:i.unit==="ك"?"ك":"ق",color:i.color||"",light:i.light||"",note:i.note||""});if(i.per)x.per=i.per});
  const L=ref=>{const [id,k]=ref.split(":");return sel[id]&&sel[id].ls[+k||0]};
  const qtyOf=id=>sel[id]?sel[id].ls.reduce((a,l)=>a+l.n,0):0;
  const flat=()=>lines().flatMap(([pid,x])=>x.ls.filter(l=>l.n>0).map(l=>({pid,...l,per:x.per})));
  let subManual=editing&&editing.subManual!=null?editing.subManual:null,discMode=editing&&editing.discAmt!=null?"amt":"pct";
  const extras=src.filter(i=>!i.pid).map(i=>({...i}));
  let co="",cat="الكل",q="",picked=false;
  // one product card is open at a time; the colour/light chooser opens under its button
  let openId=null,chooser=null;const noteOpen=new Set();
  // two wrappers: on the phone they dissolve into one column (display:contents + order),
  // on a wide screen they become side-by-side panes: order details | products
  const sh=sheet(editing?`تعديل طلب #${editing.no}`:"طلب جديد",`<div class="oe-side">
    ${custSelect("oc",editing?editing.customerId:init.customerId)}
    <button type="button" class="link" id="ocNew" style="align-self:flex-start;margin-top:-8px">+ عميل جديد</button>
    <div class="inrow" id="ocBox" hidden><input class="inp" id="ocName" placeholder="اسم المحل"><input class="inp" id="ocArea" placeholder="المنطقة"><button type="button" class="btn dark" id="ocAdd" style="flex:none">ضيف</button></div>
    <div class="inrow" style="align-items:flex-end">
