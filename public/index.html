      <div id="exl"></div></details>
    <label class="f oe-late">ملاحظة<div class="inrow"><textarea class="inp" id="on" placeholder="ميعاد التسليم، أي حاجة تانية…">${esc(editing?editing.note:init.note||"")}</textarea>${micHTML("on")}</div></label></div>
    <div class="oe-main">
    ${searchBox("pq","دوّر على منتج أو كود")}
    <div class="chips" id="pco"><button class="chip" data-co="">الكل</button>${CAT.companies.map(c=>`<button class="chip" data-co="${c.id}">${esc(c.name)}</button>`).join("")}<button class="chip" data-picked aria-pressed="false">اخترت <span class="num" id="pcount">0</span></button></div>
    <div class="chips" id="pcats"></div>
    <div class="oh"><h3>المنتجات</h3><span class="hint" id="ocount"></span></div>
    <div class="plist" id="plist"></div></div>`,
    `<div class="osum"><div class="main"><span class="hint" id="ofl">الإجمالي</span><div class="onet"><span class="num" id="ofnet">0</span><small>جنيه</small></div></div><button type="button" class="link" id="oDisc">تعديل الخصم</button></div>
     <button class="btn primary block" id="oSend">${icon("send")}${editing&&editing.status!=="draft"?"احفظ وابعت التعديل":"مراجعة الطلب وإرساله"}</button>`,
    {full:true,act:`<button type="button" class="link" id="oSave">${editing?"احفظ":"حفظ مسودة"}</button>`});
  const lines=()=>Object.entries(sel).filter(([id])=>qtyOf(id)>0);
  // what this customer usually takes (how many of his orders had it), shown first
  const USUAL="بياخد عادةً";
  const usual=()=>{const cid=$("#oc").value;if(!cid)return[];const n={};
    S.orders.forEach(o=>{if(o.customerId===cid&&o!==editing)new Set(o.items.map(i=>i.pid).filter(Boolean)).forEach(pid=>n[pid]=(n[pid]||0)+1)});
    return Object.keys(n).sort((a,b)=>n[b]-n[a]).map(prod).filter(p=>p&&PMAP[p.id]&&!p.hide).slice(0,12)};
  const UN={ك:"كرتونة",ق:"قطعة"};
  const optsOf=(p,l)=>{const own=(p.colors&&p.colors.length)||(p.lights&&p.lights.length);
    return {cols:[...new Set([...(own?p.colors||[]:BODY),...(l.color?[l.color]:[])])],lts:[...new Set([...(own?p.lights||[]:LIGHT),...(l.light?[l.light]:[])])]}};
  // one line of an open card: carton/piece, count, colour and light pickers, note
  const lineHTML=(p,k,l)=>{const ref=`${p.id}:${k}`,{cols,lts}=optsOf(p,l),open=chooser&&chooser.ref===ref?chooser.kind:"";
    return `<div class="oline">
      <div class="octl"><div class="useg" role="group" aria-label="كرتونة ولا قطعة">${["ك","ق"].map(u=>`<button data-u="${ref}|${u}" aria-pressed="${l.u===u}">${UN[u]}</button>`).join("")}</div>
        <div class="qbox"><span class="qlbl">الكمية</span><div class="stepper"><button class="add" data-p="${ref}" aria-label="زوّد">${icon("plus")}</button><input class="num" data-q="${ref}" value="${l.n}" inputmode="numeric" aria-label="الكمية"><button data-m="${ref}" aria-label="أقل">${icon("minus")}</button></div></div>
        ${k?`<button class="ox" data-lx="${ref}" aria-label="شيل السطر ده">${icon("x")}</button>`:""}</div>
      ${cols.length||lts.length?`<div class="opk">${cols.length?`<button class="pkb ${l.color?"on":""}" data-pk="${ref}|col" aria-expanded="${open==="col"}">${l.color?`لون: ${esc(l.color)}`:"اختار اللون"}${icon("down")}</button>`:""}
        ${lts.length?`<button class="pkb ${l.light?"on":""}" data-pk="${ref}|lt" aria-expanded="${open==="lt"}">${l.light?`إضاءة: ${esc(l.light)}`:"اختار الإضاءة"}${icon("down")}</button>`:""}</div>`:""}
      ${open?`<div class="ochips">${(open==="col"?cols:lts).map(c=>`<button class="chip" data-${open==="col"?"col":"lt"}="${ref}|${esc(c)}" aria-pressed="${(open==="col"?l.color:l.light)===c}">${esc(c)}</button>`).join("")}</div>`:""}
      ${l.note||noteOpen.has(ref)?`<input class="inp lnote" data-note="${ref}" value="${esc(l.note)}" placeholder="ملحوظة على السطر ده (تبديل، لون تاني…)">`:`<button type="button" class="link sm" data-addnote="${ref}">+ ملحوظة</button>`}</div>`};
  const summary=x=>x.ls.filter(l=>l.n>0).map(l=>`<span class="num">${l.n}</span> ${UN[l.u]}${l.color?` · ${esc(l.color)}`:""}${l.light?` · ${esc(l.light)}`:""}`).join(" + ");
  const row=p=>{const x=sel[p.id],n=qtyOf(p.id),open=n&&openId===p.id;
    const head=`<button class="thumb" data-zoom="${p.id}" aria-label="كبّر الصورة">${imgHTML(p)}</button>
      <div class="main"><div class="t">${esc(p.name)}${p.code?` <span class="code">${esc(p.code)}</span>`:""}</div><div class="s">${q||picked||!co?esc(coName(p.co))+" · ":""}${p.price?`<span class="num">${fmtM(p.price)}</span> جنيه / قطعة`:"من غير سعر"}</div>
      ${n&&!open?`<div class="osumm">${summary(x)}</div>`:""}</div>`;
    if(!n)return `<div class="pc" data-row="${p.id}"><div class="pch">${head}<button class="addbtn" data-p="${p.id}">${icon("plus")}ضيف</button></div></div>`;
    if(!open)return `<div class="pc sel" data-row="${p.id}"><div class="pch">${head}<button class="link" data-open="${p.id}">تعديل</button></div></div>`;
    return `<div class="pc sel open" data-row="${p.id}"><div class="pch">${head}</div>${x.ls.map((l,k)=>lineHTML(p,k,l)).join("")}
      ${x.ls.some(l=>l.u==="ك")?`<label class="per ${x.per?"":"need"}">الكرتونة فيها <input class="num" data-per="${p.id}" value="${x.per||""}" inputmode="numeric" placeholder="؟"> قطعة${x.per?"":" · علشان تتحسب في المجموع"}</label>`:""}
      <div class="pcf"><button type="button" class="link" data-more="${p.id}">+ لون تاني</button><button type="button" class="link" data-open="">تمام</button></div></div>`};
  const draft=()=>({items:[...flat().map(l=>({pid:l.pid,qty:l.n,unit:l.u,per:l.u==="ك"?l.per:0,price:prod(l.pid)?.price||0})),...extras],
    subManual,disc:discMode==="pct"?parseFloat($("#odisc").value)||0:0,discAmt:discMode==="amt"?(parseFloat($("#odiscA").value)||0):null});
  const sums=()=>{const ls=flat();const n=ls.length+extras.length;$("#pcount").textContent=lines().length;$("#ocount").textContent=n?(n===1?"صنف واحد في الطلب":`${n} أصناف في الطلب`):"";
    const m=orderMoney(draft());$("#osub").textContent=fmtM(m.sub);$("#opcs").textContent=m.pcs?`(${m.pcs} قطعة)`:"";
    $("#onet").textContent=$("#ofnet").textContent=fmtM(m.net);$("#osubEd").textContent=m.manual?"بإيدك ✎":"تعديل";
    $("#ofl").textContent=m.disc?`الإجمالي بعد خصم ${fmtM(m.pct)}%`:"الإجمالي";
    if(discMode==="pct")$("#odiscA").value=m.disc?Math.round(m.disc*100)/100:"";else $("#odisc").value=m.disc?m.pct:"";
    const ms=$("#omiss");ms.hidden=m.manual||!m.missing;ms.textContent=`${m.missing} صنف مش داخل في المجموع (كرتونة من غير عدد قطع، أو منتج مش في الليستة). اكتب عدد القطع، أو دوس «تعديل» واكتب المجموع بإيدك.`;
    // wide screens only: the order so far, beside the product list
    $("#opicked").innerHTML=`<h4>الطلب (${n})</h4>`+(n?`<ul class="items">${ls.map(x=>`<li><span>${esc(prod(x.pid)?.name||"")}${itemTags(x)?` · <b>${esc(itemTags(x))}</b>`:""}</span><span style="flex:none"><span class="num">${x.n}</span> ${x.u==="ك"?"كرتونة":"قطعة"}</span></li>`).join("")}${extras.map(e=>`<li><span>${esc(e.name)}</span><span><span class="num">${e.qty}</span> قطعة</span></li>`).join("")}</ul>`:`<p class="hint">اختار منتجات من القايمة</p>`)};
  const drawList=()=>{
    sh.querySelectorAll("#pco [data-co]").forEach(b=>b.setAttribute("aria-pressed",!picked&&!q&&cat!==USUAL&&b.dataset.co===co));
    sh.querySelector("[data-picked]").setAttribute("aria-pressed",picked);
    $("#pcats").hidden=picked||!!q;
    const us=usual();if(cat===USUAL&&!us.length)cat="الكل";
    $("#pcats").innerHTML=[...(us.length?[USUAL]:[]),...catsOf(co)].map(c=>`<button class="chip ${c===USUAL?"usual":""}" data-cat="${esc(c)}" aria-pressed="${c===cat}">${c===USUAL?"★ ":""}${c==="الكل"?"كل الأقسام":esc(c)}</button>`).join("");
    const list=picked?lines().map(([id])=>prod(id)).filter(Boolean):cat===USUAL&&!q?us:findProducts(co,cat,q);
    $("#plist").innerHTML=list.map(row).join("")||`<div class="empty">${picked?"لسه ما اخترتش حاجة":"مفيش منتج بالاسم ده"}</div>`;
    $("#exl").innerHTML=extras.map((e,i)=>`<div class="row"><span class="main t">${esc(e.name)}</span><span class="num">× ${e.qty}</span><button class="link" data-xadd="${i}">ضيفه للقايمة</button><button class="link" data-xr="${i}">شيل</button></div>`).join("");
    sums()};
  // redraw only the touched row so the list doesn't jump while tapping
  const redraw=ref=>{const id=ref.split(":")[0],el=sh.querySelector(`[data-row="${id}"]`),p=prod(id);if(el&&p)el.outerHTML=row(p);sums()};
  const setOpen=id=>{const prev=openId;openId=id||null;chooser=null;if(prev&&prev!==id)redraw(prev);if(id)redraw(id)};
  // a line taken down to 0 goes away when the product has other lines
  const drop=ref=>{const [id,k]=ref.split(":"),x=sel[id];if(x.ls.length>1)x.ls.splice(+k||0,1);if(picked&&!qtyOf(id))drawList();else redraw(id)};
  if(usual().length)cat=USUAL;
  drawList();
  // picking a customer jumps to what he usually takes
  $("#oc").addEventListener("change",()=>{if(!picked&&!q&&(cat==="الكل"||cat===USUAL)){cat=usual().length?USUAL:"الكل"}drawList()});
  sh.addEventListener("click",e=>{const t=e.target;const p=t.closest("[data-p]"),m=t.closest("[data-m]"),u=t.closest("[data-u]"),c=t.closest("[data-cat]"),
      k=t.closest("#pco [data-co]"),pk=t.closest("[data-picked]"),z=t.closest("[data-zoom]"),x=t.closest("[data-xr]");
    if(p){const ref=p.dataset.p;if(ref.includes(":")){L(ref).n++;redraw(ref)}else{const x=sel[ref]=sel[ref]||{per:S.carton[ref]||0,ls:[]};if(!qtyOf(ref))x.ls=[newL()];x.ls[0].n++;setOpen(ref)}}
    const cl=t.closest("[data-col]");if(cl){const [ref,c]=cl.dataset.col.split("|"),l=L(ref);l.color=l.color===c?"":c;chooser=null;redraw(ref)}
    const lt=t.closest("[data-lt]");if(lt){const [ref,c]=lt.dataset.lt.split("|"),l=L(ref);l.light=l.light===c?"":c;chooser=null;redraw(ref)}
    const pb=t.closest("[data-pk]");if(pb){const [ref,kind]=pb.dataset.pk.split("|");chooser=chooser&&chooser.ref===ref&&chooser.kind===kind?null:{ref,kind};redraw(ref)}
    const an=t.closest("[data-addnote]");if(an){const ref=an.dataset.addnote;noteOpen.add(ref);redraw(ref);sh.querySelector(`[data-note="${ref}"]`)?.focus()}
    const op=t.closest("[data-open]");if(op)setOpen(op.dataset.open);
    if(m){const ref=m.dataset.m,l=L(ref);l.n=Math.max(0,l.n-1);if(!l.n)drop(ref);else redraw(ref)}
    if(u){const [ref,un]=u.dataset.u.split("|");L(ref).u=un;redraw(ref)}
    const lx=t.closest("[data-lx]");if(lx)drop(lx.dataset.lx);
    const mo=t.closest("[data-more]");if(mo){const id=mo.dataset.more;sel[id].ls.push(newL(1));chooser={ref:`${id}:${sel[id].ls.length-1}`,kind:"col"};redraw(id)}
    if(z)lightbox(z.dataset.zoom,false);
    if(c){cat=c.dataset.cat;drawList()}
    if(k){co=k.dataset.co;filt.co=co;cat="الكل";picked=false;q="";$("#pq").value="";drawList()}
    if(pk){picked=!picked;q="";$("#pq").value="";drawList()}
    if(x){extras.splice(+x.dataset.xr,1);drawList()}
    const xa=t.closest("[data-xadd]");if(xa){const e=extras[+xa.dataset.xadd];productSheet(null,{stack:true,name:e.name,onSave:np=>{const i=extras.indexOf(e);if(i>=0)extras.splice(i,1);
      sel[np.id]={per:S.carton[np.id]||0,ls:[newL(e.qty)]};drawList()}})}
    const py=t.closest("[data-pay]");if(py)sh.querySelectorAll("[data-pay]").forEach(b=>b.setAttribute("aria-pressed",b===py))});

  sh.addEventListener("change",e=>{const i=e.target.closest("[data-q]");if(i){const ref=i.dataset.q,l=L(ref);l.n=Math.max(0,parseInt(norm(i.value))||0);if(!l.n)drop(ref);else redraw(ref)}
    const pe=e.target.closest("[data-per]");if(pe){const id=pe.dataset.per,n=Math.max(0,parseInt(pe.value)||0);sel[id].per=n;if(n)S.carton[id]=n;redraw(id)}});
  // the note is kept as it's typed, without redrawing the row (that would close the keyboard)
  sh.addEventListener("input",e=>{const nt=e.target.closest("[data-note]");if(nt)L(nt.dataset.note).note=nt.value});
  $("#pq").oninput=e=>{q=e.target.value.trim();if(q)picked=false;drawList()};
  const onCat=()=>{if(sh.isConnected)drawList();else document.removeEventListener("catchange",onCat)};document.addEventListener("catchange",onCat);
  if(editing){if(discMode==="amt")$("#odiscA").value=editing.discAmt||"";else $("#odisc").value=editing.disc||""}
  $("#oDisc").onclick=()=>{const m=$("#omoney");m.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>$("#odisc").focus({preventScroll:true}),350)};
  $("#odisc").oninput=()=>{discMode="pct";sums()};$("#odiscA").oninput=()=>{discMode="amt";sums()};
  $("#osubEd").onclick=()=>{const b=$("#osubBox");b.hidden=!b.hidden;if(!b.hidden){$("#osubIn").value=subManual??Math.round(orderMoney(draft()).auto*100)/100;$("#osubIn").focus()}};
  $("#osubIn").oninput=e=>{const v=parseFloat(e.target.value);subManual=isNaN(v)?null:v;sums()};
  $("#osubAuto").onclick=()=>{subManual=null;$("#osubBox").hidden=true;sums()};
  sums();
  // add a customer without leaving the order; the rest of his details can be filled in later
  $("#ocNew").onclick=()=>{$("#ocBox").hidden=!$("#ocBox").hidden;if(!$("#ocBox").hidden)$("#ocName").focus()};
  $("#ocAdd").onclick=()=>{const n=$("#ocName").value.trim();if(!n)return toast("اكتب اسم العميل");
    const c={id:uid(),name:n,owner:"",area:$("#ocArea").value.trim(),phone:"",opening:0};S.customers.push(c);save();
    setCust("oc",c.id);
    $("#ocBox").hidden=true;$("#ocName").value="";$("#ocArea").value="";toast(`اتضاف ${n}`)};
  $("#exa").onclick=()=>{const n=$("#exn").value.trim(),k=parseInt($("#exq").value)||1;if(!n)return toast("اكتب اسم المنتج");extras.push({name:n,qty:k,unit:"ق",price:0});$("#exn").value="";$("#exq").value="";drawList()};
  const commit=()=>{const cid=$("#oc").value;if(!cid){toast("اختار العميل الأول");return null}
    const items=[...flat().map(x=>{const p=prod(x.pid);const it={pid:x.pid,qty:x.n,unit:x.u,price:p?.price||0,name:p?.name||"منتج"};
      if(x.color)it.color=x.color;if(x.light)it.light=x.light;if(x.note.trim())it.note=x.note.trim();if(x.u==="ك")it.per=x.per||0;return it}),...extras];
    if(!items.length){toast("ضيف منتج واحد على الأقل");return null}
    let o=editing;if(!o){o={id:uid(),no:S.seq++,status:"draft",created:Date.now(),hist:{}};S.orders.push(o)}
    o.customerId=cid;o.items=items;o.note=$("#on").value.trim();
    const d=draft();o.disc=discMode==="pct"?Math.min(100,Math.max(0,d.disc)):0;o.discAmt=discMode==="amt"&&d.discAmt?d.discAmt:null;
    if(subManual!=null)o.subManual=subManual;else delete o.subManual;if(!o.discAmt)delete o.discAmt;
    if(discMode==="amt"&&o.discAmt){const m=orderMoney(o);o.disc=m.pct}o.pay=sh.querySelector('[data-pay][aria-pressed="true"]')?.dataset.pay||"";
    if(init.fromReq){const r=S.requests.find(x=>x.id===init.fromReq);if(r){r.done=true;r.doneAt=Date.now()}}
    save();return o};
  $("#oSave").onclick=()=>{const o=commit();if(!o)return;closeSheet();toast(editing?"اتحفظ":"اتحفظ، وهيفضل يفكرك لحد ما تبعته");render()};
  $("#oSend").onclick=()=>{const o=commit();if(!o)return;closeSheet();render();sendSheet(o.id,!!editing&&editing.status!=="draft")};
}

/* ---------- whatsapp message ---------- */
function waNum(p){p=String(p||"").replace(/\D/g,"");if(p.startsWith("00"))p=p.slice(2);if(p.startsWith("0"))p="2"+p;return p}
// items grouped by company, free-text items last
function groups(o){const g=[];o.items.forEach(i=>{const p=i.pid&&prod(i.pid);const k=p&&p.co?coName(p.co):"أصناف تانية";
  let x=g.find(y=>y.k===k);if(!x){x={k,items:[]};g.push(x)}x.items.push(i)});
  return g.sort((a,b)=>(a.k==="أصناف تانية")-(b.k==="أصناف تانية"))}
function moneyLines(o){const m=orderMoney(o);if(!m.sub)return[];
  return["",`المجموع: ${fmtM(m.sub)} ج${m.pcs?` (${m.pcs} قطعة)`:""}`,m.disc?`خصم العميل: ${fmtM(m.pct)}% = ${fmtM(m.disc)} ج`:null,`الإجمالي: ${fmtM(m.net)} ج`,
    !m.manual&&m.missing?`(${m.missing} صنف مش متسعّر)`:null].filter(x=>x!==null)}
function message(o,isEdit){const c=cust(o.customerId);const many=groups(o).length>1;
  return [`طلب #${o.no}`,`العميل: ${c.name}${c.owner?` (${c.owner})`:""}`,c.area?`المنطقة: ${c.area}`:null,
    ...groups(o).flatMap(g=>["",...(many?[`${g.k}:`]:[]),...g.items.map(i=>{const p=i.pid&&prod(i.pid);
      return `• ${itemName(i)}${p&&p.code?` (${p.code})`:""}${itemTags(i)?` · ${itemTags(i)}`:""} × ${i.qty} ${unitName(i)}${i.unit==="ك"&&i.per?` (${i.per} قطعة)`:""}${i.note?`\n   ملحوظة: ${i.note}`:""}`})]),
    ...moneyLines(o),o.pay?`الدفع: ${PAY[o.pay]}`:null,
    o.note?`\nملاحظة: ${o.note}`:null,S.settings.rep?`\nمن: ${S.settings.rep}`:null].filter(x=>x!==null).join("\n")}

/* the same order drawn as a picture with the product photos, for the colleague */
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
function wrap(ctx,text,maxW){const out=[];let line="";
  String(text).split(/\s+/).forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
  if(line)out.push(line);return out}
// the SalesGo symbol, drawn in the corner of the pictures sent on WhatsApp
async function drawSymbol(ctx,x,y,h){const im=await loadImg("symbol.svg");if(im)ctx.drawImage(im,x,y,h*440/480,h)}
async function orderImage(o,isEdit){
  const F="Cairo,system-ui,Tahoma,sans-serif";
  try{await Promise.all([document.fonts.load(`800 40px Cairo`),document.fonts.load(`700 30px Cairo`),document.fonts.load(`600 24px Cairo`)])}catch(e){}
  const c=cust(o.customerId),gs=groups(o),W=1080,P=44,TH=150,RH=196;
  const imgs={};await Promise.all(o.items.map(async i=>{const p=i.pid&&prod(i.pid);if(p&&p.img&&!(p.img in imgs))imgs[p.img]=await loadImg(photo(p))}));
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font=`600 26px ${F}`;const noteLines=o.note?wrap(ctx,"ملاحظة: "+o.note,W-2*P):[];
  const mo=orderMoney(o);const MH=mo.sub?(mo.disc?210:150):0;
  const H=250+(o.disc||o.pay?92:0)+gs.length*64+o.items.length*(RH+12)+MH+(noteLines.length?noteLines.length*40+30:0)+110;
  cv.width=W;cv.height=H;ctx.direction="rtl";ctx.textBaseline="middle";
  const R=(x,y,w,h,r,fill)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fillStyle=fill;ctx.fill()};
  ctx.fillStyle="#F5F0E7";ctx.fillRect(0,0,W,H);
  // header
  R(0,0,W,200,0,"#282825");await drawSymbol(ctx,P,110,56);ctx.textAlign="right";ctx.fillStyle="#FFFFFF";ctx.font=`800 46px ${F}`;
  ctx.fillText(`طلب رقم ${o.no}`,W-P,62);
  ctx.font=`700 32px ${F}`;ctx.fillText(c.name+(c.owner?` (${c.owner})`:""),W-P,120);
  ctx.font=`600 24px ${F}`;ctx.fillStyle="#D9D2C5";ctx.fillText([c.area,fmtDay(o.created)].filter(Boolean).join(" · "),W-P,166);
  ctx.textAlign="left";ctx.fillStyle="#E07A4F";ctx.font=`800 30px ${F}`;ctx.fillText(`${o.items.length} صنف`,P,62);
  let y=224;
  // discount and payment get their own strip so the colleague can't miss them
  const terms=[o.disc?`خصم العميل ${o.disc}%`:null,o.pay?`الدفع: ${PAY[o.pay]}`:null].filter(Boolean).join("   ·   ");
  if(terms){R(P,y,W-2*P,72,18,"#F6E2D8");ctx.textAlign="center";ctx.fillStyle="#BD572F";ctx.font=`800 32px ${F}`;ctx.fillText(terms,W/2,y+38);y+=92}
  for(const g of gs){
    if(gs.length>1){ctx.textAlign="right";ctx.fillStyle="#BD572F";ctx.font=`800 30px ${F}`;ctx.fillText(g.k,W-P,y+26);y+=64}
    for(const i of g.items){const p=i.pid&&prod(i.pid);
      R(P,y,W-2*P,RH,22,"#FFFFFF");
      const tx=W-P-16-TH,ty=y+(RH-TH)/2;R(tx,ty,TH,TH,16,"#F7F5F1");
      const im=p&&imgs[p.img];if(im){const s=Math.min(TH/im.width,TH/im.height);ctx.drawImage(im,tx+(TH-im.width*s)/2,ty+(TH-im.height*s)/2,im.width*s,im.height*s)}
      else{ctx.textAlign="center";ctx.fillStyle="#9A948A";ctx.font=`600 22px ${F}`;ctx.fillText("بدون صورة",tx+TH/2,ty+TH/2)}
      // quantity block on the left
      const qx=P+24;ctx.textAlign="left";ctx.direction="ltr";ctx.fillStyle="#282825";ctx.font=`800 52px ${F}`;ctx.fillText(`× ${i.qty}`,qx,y+RH/2-18);
      ctx.direction="rtl";ctx.fillStyle="#BD572F";ctx.font=`800 28px ${F}`;ctx.fillText(unitName(i),qx,y+RH/2+34);
      // name
      const nx=tx-24,nw=nx-(P+230);ctx.textAlign="right";ctx.fillStyle="#282825";ctx.font=`700 31px ${F}`;
      const nl=wrap(ctx,itemName(i),nw).slice(0,2);const lt=lineTotal(i);const sub=[p&&p.code,lt?`${fmtM(lt)} ج`:null].filter(Boolean).join(" · ");
      ctx.font=`600 24px ${F}`;const notel=i.note?wrap(ctx,"ملحوظة: "+i.note,nw).slice(0,2):[];ctx.font=`700 31px ${F}`;
      const tags=itemTags(i);const blockH=nl.length*42+(tags?40:0)+(sub?34:0)+notel.length*32;let ly=y+RH/2-blockH/2+21;
      nl.forEach(l=>{ctx.fillText(l,nx,ly);ly+=42});
      if(tags){ctx.font=`800 28px ${F}`;ctx.fillStyle="#BD572F";ctx.fillText(tags,nx,ly);ly+=40}
      if(sub){ctx.font=`600 23px ${F}`;ctx.fillStyle="#6F6A60";ctx.fillText(sub,nx,ly-4);ly+=34}
      if(notel.length){ctx.font=`600 24px ${F}`;ctx.fillStyle="#282825";notel.forEach(l=>{ctx.fillText(l,nx,ly-4);ly+=32})}
      y+=RH+12}}
  // totals, like the bottom of the company invoice
  if(mo.sub){y+=10;R(P,y,W-2*P,MH-20,22,"#282825");let ty=y+44;const row=(l,v,big,col)=>{ctx.textAlign="right";ctx.fillStyle=col||"#F5F0E7";ctx.font=`${big?800:700} ${big?34:28}px ${F}`;ctx.fillText(l,W-P-28,ty);
      ctx.textAlign="left";ctx.fillText(v,P+28,ty);ty+=big?60:50};
    row(`المجموع${mo.pcs?` (${mo.pcs} قطعة)`:""}`,`${fmtM(mo.sub)} ج`);if(mo.disc)row(`خصم ${fmtM(mo.pct)}%`,`− ${fmtM(mo.disc)} ج`,false,"#E8A88C");
    row("الإجمالي",`${fmtM(mo.net)} ج`,true,"#FFFFFF");y+=MH-10}
  if(noteLines.length){y+=14;ctx.textAlign="right";ctx.fillStyle="#282825";ctx.font=`600 26px ${F}`;noteLines.forEach(l=>{ctx.fillText(l,W-P,y+20);y+=40});y+=16}
  ctx.textAlign="right";ctx.fillStyle="#6F6A60";ctx.font=`600 22px ${F}`;ctx.fillText(S.settings.rep?`من: ${S.settings.rep}`:"",W-P,H-48);
  ctx.textAlign="left";ctx.direction="ltr";ctx.fillText("SalesGo by MESTK",P,H-48);
  return new Promise(r=>cv.toBlob(r,"image/jpeg",0.9))}

function sendSheet(id,isEdit){const o=S.orders.find(x=>x.id===id);const txt=message(o,isEdit),c=cust(o.customerId),cph=bcPhone(c);
  const href=`https://wa.me/${S.settings.phone?waNum(S.settings.phone):""}?text=${encodeURIComponent(txt)}`;
  const sh=sheet(o.status!=="draft"?"ابعت الطلب تاني":S.settings.colleague?`ابعت الطلب لـ ${S.settings.colleague}`:"ابعت الطلب",`<div class="oimg" id="oimg"><span class="hint">بجهز صورة الطلب…</span></div>
    <details><summary class="link" style="cursor:pointer">شوف الرسالة</summary><div class="msg" id="mtxt" style="margin-top:8px">${esc(txt)}</div></details>
    <p class="hint">اختار تبعت الصورة ولا الرسالة. هتفتحلك المشاركة: اختار واتساب وبعدين ${esc(S.settings.colleague||"زميلك")} أو الجروب أو العميل.${cph?` و«ابعته للعميل» بتفتح شات ${esc(c.name)} والرسالة مكتوبة.`:""}</p>`,
    `<div class="btns"><button class="btn wa" id="shr" disabled>ابعت الصورة</button><button class="btn ghost" id="stx">ابعت الرسالة</button></div>
     <div class="btns">${cph?`<a class="btn ghost" id="scu" href="https://wa.me/${cph}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">ابعته للعميل</a>`:""}<button class="btn ghost" id="cp">انسخ الرسالة</button>${o.status==="draft"?`<button class="btn ghost" id="mk">بعته خلاص ✓</button>`:""}</div>`);
  const mark=()=>{if(o.status==="draft"){o.status="sent";o.hist.sent=Date.now();save()}};
  // sending again never changes the order's step
  const again=o.status!=="draft",done=()=>{mark();closeSheet();render();toast(again?`طلب #${o.no} اتبعت تاني`:`طلب #${o.no} اتعلم إنه اتبعت`)};
  const copy=()=>navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject();
  let file=null;const shr=sh.querySelector("#shr");
  orderImage(o,isEdit).then(blob=>{if(!blob||!sh.isConnected)return;file=new File([blob],`طلب-${o.no}.jpg`,{type:"image/jpeg"});
    $("#oimg").innerHTML=`<img src="${URL.createObjectURL(blob)}" alt="صورة الطلب">`;shr.disabled=false}).catch(()=>{$("#oimg").innerHTML=`<span class="hint">مقدرتش أعمل الصورة، ابعت الرسالة</span>`});
  // the picture alone (no caption), or the text alone: the rep picks one
  shr.onclick=async()=>{if(!file)return;const data={files:[file]};
    if(navigator.canShare&&navigator.canShare(data)){
      try{await navigator.share(data);done()}catch(e){if(e&&e.name!=="AbortError")toast("مقدرتش أفتح المشاركة، جرب «ابعت الرسالة»")}}
    else{// no file sharing here (desktop): save the picture so it can be attached by hand
      const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast("الصورة نزلت، ابعتها من واتساب")}};
  sh.querySelector("#stx").onclick=async()=>{
    if(navigator.share){try{await navigator.share({text:txt});done()}catch(e){if(e&&e.name!=="AbortError"){window.open(href,"_blank","noopener");setTimeout(done,400)}}}
    else{window.open(href,"_blank","noopener");setTimeout(done,400)}};
  sh.querySelector("#mk")?.addEventListener("click",done);
  sh.querySelector("#scu")?.addEventListener("click",()=>setTimeout(done,400));
  sh.querySelector("#cp").onclick=()=>{copy().then(()=>toast("اتنسخت"),()=>{const d=sh.querySelector("details");d.open=true;const r=document.createRange();r.selectNodeContents($("#mtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("اتحددت، انسخها")})}}

function orderSheet(id){const o=S.orders.find(x=>x.id===id);const c=cust(o.customerId);const s=STATUSES[SIDX[o.status]];
  const sh=sheet(`طلب #${o.no}`,`<div class="card"><div class="hd"><span class="main"><b>${esc(c.name)}</b><br><span style="color:var(--muted);font-size:13px">${esc(c.owner)} · ${esc(when(o.created))}</span></span><span class="pill st-${o.status}">${s.t}</span></div>
    <ul class="items" style="color:var(--fg)">${o.items.map(i=>`<li><span>${esc(itemName(i))}${itemTags(i)?` · <b>${esc(itemTags(i))}</b>`:""}${i.note?`<br><small>${esc(i.note)}</small>`:""}</span><span style="flex:none"><span class="num">${i.qty}</span> ${unitName(i)}</span></li>`).join("")}</ul>
    ${o.note?`<div class="hint">ملاحظة: ${esc(o.note)}</div>`:""}${(()=>{const m=orderMoney(o);return m.sub?`<div class="total"><span>المجموع</span><span>${money(m.sub)} ج</span></div>${m.disc?`<div class="total"><span>خصم ${fmtM(m.pct)}%</span><span>− ${money(m.disc)} ج</span></div>`:""}<div class="total"><span>الإجمالي</span><span>${money(m.net)} ج</span></div>`:""})()}
    <div class="inrow" style="align-items:center"><span class="hint" style="flex:none">الدفع</span><div class="seg" id="opay2">${[["cash","كاش"],["credit","آجل"],["","بعدين"]].map(([k,t])=>`<button data-pay="${k}" aria-pressed="${(o.pay||"")===k}">${t}</button>`).join("")}</div></div></div>
    <section class="sec"><h2>المراحل</h2><div class="list">${STATUSES.map((x,i)=>{const t=i===0?o.created:o.hist[x.k];return `<div class="row"><span class="dot ${i<=SIDX[o.status]?"ok":""}" style="${i<=SIDX[o.status]?"":"background:var(--line)"}"></span><span class="main">${x.t}</span><span class="s">${t?esc(when(t)):""}</span></div>`}).join("")}</div></section>`,
    `${o.status==="draft"?`<button class="btn wa block" id="osd">ابعته واتساب</button>`:s.next?`<button class="btn primary block" id="oad">${s.next} ✓</button>`:""}
     ${o.status!=="draft"?`<button class="btn wa block" id="osa">📤 ابعته تاني</button>`:""}
     <div class="btns"><button class="btn ghost" id="oed">عدّل</button><button class="btn ghost" id="ocu">افتح العميل</button><button class="btn ghost" id="odl">امسح</button></div>`);
  sh.querySelector("#opay2").onclick=e=>{const b=e.target.closest("[data-pay]");if(!b)return;o.pay=b.dataset.pay;save();
    sh.querySelectorAll("#opay2 [data-pay]").forEach(x=>x.setAttribute("aria-pressed",x===b));toast(o.pay?`اتسجل ${PAY[o.pay]}`:"هتتسأل بعدين");render()};
  sh.querySelector("#osd")?.addEventListener("click",()=>{closeSheet();sendSheet(o.id)});
  sh.querySelector("#osa")?.addEventListener("click",()=>{closeSheet();sendSheet(o.id)});
  sh.querySelector("#oad")?.addEventListener("click",()=>{closeSheet();advance(o.id)});
  sh.querySelector("#oed").onclick=()=>{closeSheet();orderEditor({id:o.id})};
  sh.querySelector("#ocu").onclick=()=>{closeSheet();go("customer",o.customerId)};
  const del=sh.querySelector("#odl");del.onclick=()=>{if(del.dataset.armed){S.orders=S.orders.filter(x=>x.id!==o.id);save();closeSheet();toast("اتمسح");render()}else{del.dataset.armed=1;del.textContent="متأكد؟ دوس تاني";del.style.color="var(--bad)"}}}

/* ---------- money sheets ---------- */
function dateField(id,t,label){return `<label class="f">${label||"اليوم"}<input class="inp num" id="${id}" type="date" value="${isoDay(t)}" max="${isoDay(Date.now())}" style="text-align:right;direction:ltr"><span class="hint" id="${id}w">${esc(dayLabel(t))}</span></label>`}
function bindDate(id){const i=$("#"+id);i.oninput=()=>{$("#"+id+"w").textContent=i.value?dayLabel(fromIso(i.value)):""}}
// "امسح" needs a second tap
function armDel(btn,fn){btn.onclick=()=>{if(btn.dataset.armed)fn();else{btn.dataset.armed=1;btn.textContent="متأكد؟ دوس تاني";btn.style.color="var(--bad)"}}}
function collectSheet(cid,payId){const p=payId?S.payments.find(x=>x.id===payId):null;if(p)cid=p.customerId;
  const sh=sheet(p?"تعديل تحصيل":"تحصيل",`${p?`<div class="card sendone"><span class="hint">ابعت التحصيل ده للزميل أو الجروب</span><div class="btns"><button class="btn wa" id="p1img">ابعت صورة</button><button class="btn ghost" id="p1txt">ابعت رسالة</button></div></div>`:""}
    ${custSelect("pc",cid)}<div id="pbal" class="hint"></div>
    <label class="f">المبلغ<input class="inp num" id="pa" type="number" inputmode="decimal" placeholder="0" value="${p?p.amount:""}" style="text-align:right;direction:rtl"></label>
    ${dateField("pd",p?p.date:Date.now())}
    <div class="inrow" style="align-items:center"><button type="button" class="chip" id="pold" aria-pressed="${!!(p&&p.forDate)}" style="flex:none">دفعة قديمة</button>
      <label class="f" id="pforL" ${p&&p.forDate?"":"hidden"} style="flex-direction:row;align-items:center;gap:8px">عن يوم<input class="inp num" id="pfor" type="date" max="${isoDay(Date.now())}" value="${p&&p.forDate?isoDay(p.forDate):""}" style="direction:ltr"></label></div>
    <label class="f">ملاحظة (اختياري)<input class="inp" id="pn" value="${esc(p?p.note:"")}" placeholder="كاش، تحويل…"></label>`,
    p?`<div class="btns"><button class="btn primary" id="ps">احفظ التعديل</button><button class="btn ghost" id="pdl" style="flex:0 0 auto">امسح</button></div>`
     :`<div class="btns"><button class="btn primary" id="ps">سجّل التحصيل</button><button class="btn wa" id="psh">سجّل وابعته</button></div>`);
  if(p){sh.querySelector("#p1txt").onclick=()=>shareText(payMessage(p));sh.querySelector("#p1img").onclick=()=>sharePayImage(p)}
  const upd=()=>{const c=$("#pc").value;const b=c?Math.round(balance(c)):0;$("#pbal").textContent=!c?"":b>0?`عليه دلوقتي ${b.toLocaleString("en-US")} ج`:b<0?`ليه عندك ${(-b).toLocaleString("en-US")} ج`:"حسابه خالص"};upd();$("#pc").onchange=upd;bindDate("pd");
  sh.querySelector("#pold").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);$("#pforL").hidden=!on;
    if(on&&!$("#pfor").value)$("#pfor").value=isoDay(fromIso($("#pd").value)-7*DAY)};
  const keep=share=>{const c=$("#pc").value,a=parseFloat($("#pa").value);if(!c)return toast("اختار العميل");if(!(a>0))return toast("اكتب المبلغ");
    const isOld=sh.querySelector("#pold").getAttribute("aria-pressed")==="true";if(isOld&&!$("#pfor").value)return toast("اختار الدفعة القديمة عن أنهي يوم");
    const d={customerId:c,amount:a,date:fromIso($("#pd").value,p&&p.date),note:$("#pn").value.trim()};
    let x=p;if(x)Object.assign(x,d);else{x={id:uid(),...d};S.payments.push(x)}
    if(isOld)x.forDate=fromIso($("#pfor").value,x.forDate);else delete x.forDate;save();closeSheet();
    toast(p?"اتعدل":`اتسجل ${a.toLocaleString("en-US")} ج · بقى معاك ${Math.round(cashInHand()).toLocaleString("en-US")} ج`);render();
    if(share)shareText(payMessage(x))};
  sh.querySelector("#ps").onclick=()=>keep(false);sh.querySelector("#psh")?.addEventListener("click",()=>keep(true));
  const del=sh.querySelector("#pdl");if(del)armDel(del,()=>{S.payments=S.payments.filter(x=>x!==p);save();closeSheet();toast("اتمسح");render()});
}
/* one collection as a small receipt picture */
async function payImage(p){const F="Cairo,system-ui,Tahoma,sans-serif";try{await document.fonts.load(`800 40px Cairo`)}catch(e){}
  const c=cust(p.customerId),b=balance(p.customerId),d=new Date(p.date),W=1080,P=48;
  const lines=[p.forDate?`دفعة قديمة · عن يوم ${fmtDay(p.forDate)}`:null,p.note?`ملحوظة: ${p.note}`:null].filter(Boolean);
  const H=520+lines.length*52+(b>0?70:0);const cv=document.createElement("canvas"),ctx=cv.getContext("2d");cv.width=W;cv.height=H;
  ctx.direction="rtl";ctx.textBaseline="middle";const R=(x,y,w,h,r,fill)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fillStyle=fill;ctx.fill()};
  ctx.fillStyle="#F5F0E7";ctx.fillRect(0,0,W,H);R(0,0,W,170,0,"#282825");await drawSymbol(ctx,P,57,56);
  ctx.textAlign="right";ctx.fillStyle="#FFFFFF";ctx.font=`800 46px ${F}`;ctx.fillText("إيصال تحصيل",W-P,64);
  ctx.font=`600 28px ${F}`;ctx.fillStyle="#D9D2C5";ctx.fillText(`${WD[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}${S.settings.rep?` · ${S.settings.rep}`:""}`,W-P,122);
  let y=210;ctx.fillStyle="#282825";ctx.font=`800 40px ${F}`;ctx.fillText(c.name+(c.owner?` (${c.owner})`:""),W-P,y);y+=50;
  if(c.area){ctx.font=`600 26px ${F}`;ctx.fillStyle="#6F6A60";ctx.fillText(c.area,W-P,y)}y+=40;
  R(P,y,W-2*P,120,22,"#2F7D4F");ctx.fillStyle="#FFFFFF";ctx.font=`800 34px ${F}`;ctx.fillText("المبلغ",W-P-28,y+60);
  ctx.textAlign="left";ctx.font=`800 52px ${F}`;ctx.fillText(`${p.amount.toLocaleString("en-US")} ج`,P+28,y+60);y+=150;
  ctx.textAlign="right";lines.forEach(l=>{ctx.font=`700 28px ${F}`;ctx.fillStyle=l.startsWith("دفعة قديمة")?"#BD572F":"#282825";ctx.fillText(l,W-P,y);y+=52});
  // only "still owes" is worth telling the colleague; a credit usually just means the opening balance wasn't typed yet
  if(b>0){ctx.font=`700 28px ${F}`;ctx.fillStyle="#6F6A60";ctx.fillText(`الباقي عليه: ${Math.round(b).toLocaleString("en-US")} ج`,W-P,y+10)}
  ctx.textAlign="right";ctx.fillStyle="#6F6A60";ctx.font=`600 22px ${F}`;ctx.fillText("SalesGo",W-P,H-36);ctx.textAlign="left";ctx.fillText("by MESTK",P,H-36);
  return new Promise(r=>cv.toBlob(r,"image/jpeg",0.92))}
async function sharePayImage(p){const blob=await payImage(p);const file=new File([blob],`تحصيل-${cust(p.customerId).name}.jpg`,{type:"image/jpeg"});const data={files:[file]};
  if(navigator.canShare&&navigator.canShare(data)){try{await navigator.share(data)}catch(e){}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast("الصورة نزلت، ابعتها من واتساب")}}
function payMessage(p){const c=cust(p.customerId);const b=balance(p.customerId);
  return ["تحصيل",`العميل: ${c.name}${c.owner?` (${c.owner})`:""}`,`المبلغ: ${p.amount.toLocaleString("en-US")} ج`,`اليوم: ${fmtDay(p.date)}`,
    p.forDate?`دفعة قديمة عن يوم ${fmtDay(p.forDate)}`:null,p.note?`ملاحظة: ${p.note}`:null,b>0?`الباقي عليه: ${Math.round(b).toLocaleString("en-US")} ج`:null,S.settings.rep?`من: ${S.settings.rep}`:null].filter(Boolean).join("\n")}
// share menu (pick a WhatsApp group or a person); WhatsApp's own picker where sharing isn't available
function shareText(txt){if(navigator.share)navigator.share({text:txt}).catch(()=>{});else window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,"_blank","noopener")}
/* collections counter on Home: counts from the day the rep last zeroed it (today if he never did) */
const colFrom=()=>S.colFrom||sod(Date.now());
function colSheet(){const from=colFrom();const list=S.payments.filter(p=>p.date>=from).sort((a,b)=>b.date-a.date);const sum=list.reduce((a,p)=>a+p.amount,0);
  const sh=sheet(S.colFrom?`حصّلت من ${fmtDay(from)}`:"حصّلت النهارده",`<div class="card"><span class="hint">المجموع</span><div style="font-size:24px;font-weight:800">${money(sum)} ج</div><span class="hint">${list.length} تحصيل · دوس على أي واحد علشان تعدله أو تمسحه</span></div>
    ${list.length?`<div class="list ledger">${list.map(p=>`<button class="row" data-mv="pay:${p.id}"><span class="main"><span class="t">${esc(cust(p.customerId).name)}${p.note?` · ${esc(p.note)}`:""}</span><br><span class="s">${esc(dayLabel(p.date))}</span></span><span class="amt minus">${smoney("+",p.amount)}</span></button>`).join("")}</div>`:`<div class="empty">مفيش تحصيلات من ساعة ما صفّرت</div>`}
    <p class="hint">التصفير بيبدأ العد من الصفر بس. التحصيلات نفسها مش بتتمسح، والفلوس اللي معاك مش بتتغير (دي بتقل لما تسجل «سلّمت للشركة»).</p>`,
    `<button class="btn dark block" id="cz">صفّر العداد</button>${S.colFrom?`<button class="btn ghost block" id="ct">رجّعه لتحصيل النهارده بس</button>`:""}`);
  bindMoves(sh);
  armDel(sh.querySelector("#cz"),()=>{S.colFrom=Date.now();save();closeSheet();toast("العداد اتصفّر");render()});
  sh.querySelector("#ct")?.addEventListener("click",()=>{delete S.colFrom;save();closeSheet();toast("رجع يعد تحصيل النهارده");render()})}
function handoverSheet(hid){const h=hid?S.handovers.find(x=>x.id===hid):null;const cih=Math.max(0,Math.round(cashInHand()));
  const sh=sheet(h?"تعديل تسليم":"سلّمت للشركة",`${h?"":`<div class="card"><span class="hint">معاك دلوقتي</span><div style="font-size:24px;font-weight:800">${money(cih)} ج</div></div>`}
    <label class="f">سلّمت كام؟<input class="inp num" id="ha" type="number" inputmode="decimal" value="${h?h.amount:cih}" style="text-align:right;direction:rtl"></label>
    ${dateField("hd",h?h.date:Date.now())}
    <label class="f">ملاحظة (اختياري)<input class="inp" id="hn" value="${esc(h?h.note:"")}" placeholder="سلمت لمين، رقم الإيصال…"></label>`,
    `<button class="btn primary block" id="hs">${h?"احفظ التعديل":"سجّل التسليم"}</button>${h?`<button class="btn ghost block" id="hdl">امسح التسليم ده</button>`:""}`);
  bindDate("hd");
  sh.querySelector("#hs").onclick=()=>{const a=parseFloat($("#ha").value);if(!(a>0))return toast("اكتب المبلغ");
    const d={amount:a,date:fromIso($("#hd").value,h&&h.date),note:$("#hn").value.trim()};
    if(h)Object.assign(h,d);else S.handovers.push({id:uid(),...d});save();closeSheet();toast(`${h?"اتعدل":"اتسجل"} · الباقي معاك ${Math.round(cashInHand()).toLocaleString("en-US")} ج`);render()};
  const del=sh.querySelector("#hdl");if(del)armDel(del,()=>{S.handovers=S.handovers.filter(x=>x!==h);save();closeSheet();toast("اتمسح");render()})}

/* opening balance: what the customer owed (عليه) or had as credit (ليه) when the rep started, as of a day */
function openingFields(c){const o=c.opening||0;return `<div class="f" style="display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)">رصيد أول المدة (اللي كان عليه أو ليه قبل ما تبدأ)
    <div class="inrow"><div class="seg" id="obs" style="flex:none"><button type="button" data-ob="1" aria-pressed="${o>=0}">عليه</button><button type="button" data-ob="-1" aria-pressed="${o<0}">ليه</button></div>
    <input class="inp num" id="cb" type="number" inputmode="decimal" value="${Math.abs(o)||""}" placeholder="0" style="text-align:right;direction:rtl"></div></div>
    ${dateField("cbd",c.openingDate||S.since||Date.now(),"لحد يوم")}`}
function bindOpening(sh){sh.querySelector("#obs").onclick=e=>{const b=e.target.closest("[data-ob]");if(!b)return;sh.querySelectorAll("[data-ob]").forEach(x=>x.setAttribute("aria-pressed",x===b))};bindDate("cbd")}
function readOpening(sh,c){const sign=sh.querySelector('[data-ob="-1"]').getAttribute("aria-pressed")==="true"?-1:1;
  return {opening:sign*(Math.abs(parseFloat($("#cb").value))||0),openingDate:fromIso($("#cbd").value,c.openingDate)}}
/* the rep controls the account: set what the customer owes now (from the company), or add/take off an amount.
   Each change is kept as its own dated line, so nothing is lost */
function adjustSheet(cid,adjId){const a=adjId?S.adjusts.find(x=>x.id===adjId):null;if(a)cid=a.customerId;const c=S.customers.find(x=>x.id===cid);if(!c)return;
  const cur=Math.round(balance(cid)),fmt=n=>Math.round(n).toLocaleString("en-US");
  const modes=a?[["add","زوّد عليه"],["sub","نزّل من عليه"]]:[["set","عليه كام"],["add","زوّد عليه"],["sub","نزّل من عليه"]];
  let mode=a?(a.amount>=0?"add":"sub"):"set";
  const sh=sheet(a?"تعديل حركة":"ظبط الحساب",`<div class="card"><span class="hint">${esc(c.name)} · ${cur<0?"ليه":"عليه"} دلوقتي</span><div style="font-size:24px;font-weight:800">${money(Math.abs(cur))} ج</div></div>
    <div class="seg" id="ajm">${modes.map(([k,t])=>`<button type="button" data-ajm="${k}" aria-pressed="${k===mode}">${t}</button>`).join("")}</div>
    <label class="f"><span id="ajl"></span><input class="inp num" id="aja" type="number" inputmode="decimal" placeholder="0" value="${a?Math.abs(a.amount):""}" style="text-align:right;direction:rtl"></label>
    <div class="hint" id="ajr"></div>
    ${dateField("ajd",a?a.date:Date.now())}
    <label class="f">ملحوظة (اختياري)<input class="inp" id="ajn" value="${esc(a?a.note:"")}" placeholder="بضاعة اتسلمت، حسب كشف الشركة…"></label>`,
    `<button class="btn primary block" id="ajs">احفظ</button>${a?`<button class="btn ghost block" id="ajdl">امسح الحركة دي</button>`:""}`);
  const base=a?cur-a.amount:cur; // balance without this line, when editing it
  const delta=()=>{const v=parseFloat($("#aja").value);if(!(v>=0))return null;return mode==="set"?v-base:mode==="add"?v:-v};
  const upd=()=>{sh.querySelectorAll("[data-ajm]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ajm===mode));
    $("#ajl").textContent=mode==="set"?"عليه كام حسب الشركة؟":mode==="add"?"زوّد عليه كام؟":"نزّل من عليه كام؟";
    const d=delta();$("#ajr").textContent=d===null?"":`هيبقى ${base+d<0?"ليه":"عليه"} ${fmt(Math.abs(base+d))} ج${mode==="set"&&d?` (${d>0?"زيادة":"نقص"} ${fmt(Math.abs(d))} ج)`:""}`};
  upd();sh.querySelector("#ajm").onclick=e=>{const b=e.target.closest("[data-ajm]");if(b){mode=b.dataset.ajm;upd()}};$("#aja").oninput=upd;bindDate("ajd");
  sh.querySelector("#ajs").onclick=()=>{const d=delta();if(d===null)return toast("اكتب المبلغ");if(!a&&!d)return toast("الحساب مظبوط، مفيش تغيير");
    const note=$("#ajn").value.trim()||(mode==="set"?"ظبط على حساب الشركة":"");const x={customerId:cid,amount:d,date:fromIso($("#ajd").value,a&&a.date),note};
    if(a)Object.assign(a,x);else (S.adjusts=S.adjusts||[]).push({id:uid(),...x});save();closeSheet();
    toast(`اتحفظ · ${balance(cid)<0?"ليه":"عليه"} ${fmt(Math.abs(balance(cid)))} ج`);render()};
  const del=sh.querySelector("#ajdl");if(del)armDel(del,()=>{S.adjusts=S.adjusts.filter(x=>x!==a);save();closeSheet();toast("اتمسحت");render()})}
function openingSheet(cid){const c=S.customers.find(x=>x.id===cid);if(!c)return;
  const sh=sheet("رصيد أول المدة",`<p class="hint">${esc(c.name)} · اكتب اللي كان عليه أو ليه قبل ما تسجل طلباته وتحصيلاته هنا. تقدر تغيره في أي وقت.</p>${openingFields(c)}`,
    `<button class="btn primary block" id="obsv">احفظ</button>`);
  bindOpening(sh);sh.querySelector("#obsv").onclick=()=>{Object.assign(c,readOpening(sh,c));save();closeSheet();toast("اتحفظ");render()}}

/* ---------- customers ---------- */
function customerSheet(id){const c=id?S.customers.find(x=>x.id===id):{name:"",owner:"",area:"",phone:"",opening:0};
  const sh=sheet(id?"تعديل عميل":"عميل جديد",`<label class="f">اسم المحل أو الشركة<input class="inp" id="cn" value="${esc(c.name)}"></label>
    <label class="f">اسم المسؤول<input class="inp" id="co" value="${esc(c.owner)}"></label>
    <div class="inrow"><label class="f">المنطقة<input class="inp" id="ca" value="${esc(c.area)}"></label><label class="f">التليفون<input class="inp num" id="cp2" type="tel" value="${esc(c.phone)}" style="text-align:right;direction:ltr"></label></div>
    ${openingFields(c)}`,
    `<button class="btn primary block" id="cs">احفظ</button>${id?`<button class="btn ghost block" id="cdl">امسح العميل ده</button>`:""}`);
  bindOpening(sh);
  // deleting a customer takes his orders, requests, collections and account lines with him, so say how many first
  const dl=sh.querySelector("#cdl");if(dl){const mine=k=>(S[k]||[]).filter(x=>x.customerId===id).length;
    const n={o:mine("orders"),r:mine("requests"),p:mine("payments"),a:mine("adjusts")};const any=n.o+n.r+n.p+n.a;
    dl.onclick=()=>{if(!dl.dataset.armed){dl.dataset.armed=1;dl.style.color="var(--bad)";
        dl.textContent=any?`هيتمسح معاه ${[n.o&&`${n.o} طلب`,n.p&&`${n.p} تحصيل`,n.r&&`${n.r} مستني`,n.a&&`${n.a} حركة حساب`].filter(Boolean).join(" و ")} · دوس تاني للتأكيد`:"متأكد؟ دوس تاني";return}
      S.customers=S.customers.filter(x=>x.id!==id);["orders","requests","payments","adjusts"].forEach(k=>{if(S[k])S[k]=S[k].filter(x=>x.customerId!==id)});
      save();closeSheet();toast(`اتمسح ${c.name}`);go("customers")}}
  sh.querySelector("#cs").onclick=()=>{const n=$("#cn").value.trim();if(!n)return toast("اكتب اسم العميل");
    const d={name:n,owner:$("#co").value.trim(),area:$("#ca").value.trim(),phone:$("#cp2").value.trim(),...readOpening(sh,c)};
    if(id)Object.assign(c,d);else{d.id=uid();S.customers.push(d)}save();closeSheet();toast("اتحفظ");if(!id)go("customer",d.id);else render()}}

/* ---------- backup ---------- */
function backup(outEl){const data=JSON.stringify(myImgKeys().length?{...S,_img:Object.fromEntries(myImgKeys().map(k=>[k,UIMG[k]]))}:S);let ok=false;
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`mandoub-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}
  if(outEl)outEl.innerHTML=`<p class="hint">لو الملف ما نزلش، انسخ النص ده واحفظه:</p><textarea class="inp" readonly style="min-height:70px;font-size:11px;direction:ltr">${esc(data)}</textarea>`;
  S.lastBackup=Date.now();save();toast(ok?"النسخة نزلت في التنزيلات":"اتجهزت النسخة")}
function backupDue(){if(S.demo)return 0;const d=daysSince(S.lastBackup||S.since||Date.now());return d>=3?d:0}
function backupBar(){const d=backupDue();if(!d)return"";
  return `<div class="card" style="border-color:var(--warn);background:var(--warn-soft)"><div class="hd"><span class="main"><b>${S.lastBackup?`آخر نسخة احتياطية من ${d} أيام`:"لسه ما خدتش نسخة احتياطية"}</b><br><span class="s" style="font-size:13px;color:var(--muted)">النسخة بتحمي عملاءك وحساباتك لو حصل حاجة للموبايل. احفظها في Drive أو ابعتها لنفسك واتساب</span></span></div>
  <button class="btn dark block" id="bkNow">خد نسخة دلوقتي</button></div>`}

/* ---------- settings ---------- */
function settingsSheet(){const s=S.settings;
  const sh=sheet("الإعدادات",`<label class="f">اسمك<input class="inp" id="sr" value="${esc(s.rep)}" placeholder="بيظهر في الرسالة وفي التحية"></label>
    <div class="inrow"><label class="f">زميلك اللي بيسجل الطلبات<input class="inp" id="sc" value="${esc(s.colleague)}"></label><label class="f">رقم الواتساب بتاعه<input class="inp num" id="sp" type="tel" value="${esc(s.phone)}" placeholder="01xxxxxxxxx" style="text-align:right;direction:ltr"></label></div>
    <label class="f">لو طلب اتحفظ وما اتبعتش للزميل، يظهرلك بالأحمر في «محتاج تفتكر» بعد<select class="inp" id="srm"><option value="0" ${s.remind==0?"selected":""}>على طول</option><option value="1" ${s.remind==1?"selected":""}>يوم</option><option value="2" ${s.remind==2?"selected":""}>يومين</option></select></label>
    <section class="sec"><h2>الإشعارات</h2>
    <p class="hint">التطبيق يفكّرك بإشعار على الموبايل حتى لو قافله. كروم هو اللي بيحدد إمتى، غالبًا مرة أو مرتين في اليوم، ولازم التطبيق يكون متثبّت على الشاشة.</p>
    <div class="list">${NOTIF.map(([k,t])=>`<label class="row" style="cursor:pointer"><span class="main t" style="font-weight:600">${t}</span><input type="checkbox" data-nt="${k}" ${notifOn(k)?"checked":""} style="width:22px;height:22px;accent-color:var(--accent)"></label>`).join("")}</div>

    <section class="sec"><h2>البيانات</h2><p class="hint">البيانات محفوظة على الموبايل ده بس. خد نسخة احتياطية كل فترة.</p>
    <div class="btns"><button class="btn ghost" id="sx">نسخة احتياطية</button><label class="btn ghost" style="cursor:pointer">استرجاع نسخة<input type="file" id="si" accept="application/json" hidden></label></div>
    <div id="sxout"></div>
    ${S.demo?`<button class="btn dark block" id="sclr">امسح البيانات التجريبية وابدأ بعملائي</button>`:""}<button class="btn ghost block" id="sdemo">رجّع البيانات التجريبية</button></section>
    ${TRIAL&&licGet()?(l=>`<section class="sec"><h2>نسخة التجربة</h2><div class="card"><div class="total"><span>الكود</span><span class="num" style="direction:ltr">${esc(l.code)}</span></div>
      <div class="hint">لحد يوم ${esc(fmtDay(l.until))} · آخر تأكيد ${esc(when(l.okAt))}</div></div></section>`)(licGet()):""}
    <section class="sec"><h2>تحديث البرنامج</h2>
    <div class="card"><div class="total"><span>النسخة اللي عندك</span><span class="num">v${VERSION}</span></div><div class="hint" id="upHint">دوس علشان تشوف فيه نسخة أحدث ولا لأ. بياناتك مش بتتأثر بالتحديث.</div>
    <button class="btn dark block" id="upBtn">دوّر على تحديث</button></div></section>
    <p class="tagline">SalesGo by MESTK</p>`,`<button class="btn primary block" id="ss">احفظ</button>`);
  sh.querySelector("#ss").onclick=()=>{Object.assign(s,{rep:$("#sr").value.trim(),colleague:$("#sc").value.trim(),phone:$("#sp").value.trim(),remind:+$("#srm").value});save();closeSheet();toast("اتحفظ");render()};
  sh.querySelectorAll("[data-nt]").forEach(c=>c.onchange=()=>{s.notif={...(s.notif||{}),[c.dataset.nt]:c.checked};save()});

  sh.querySelector("#sx").onclick=()=>backup($("#sxout"));
  const ub=sh.querySelector("#upBtn");ub.onclick=async()=>{
    if(ub.dataset.ready){applyUpdate();return}
    ub.disabled=true;ub.textContent="بدوّر…";const v=await latestVersion();ub.disabled=false;
    if(v===null){$("#upHint").textContent="مقدرتش أوصل للنت. جرّب تاني وإنت على الداتا أو واي فاي شغال.";ub.textContent="دوّر تاني";return}
    if(v>VERSION){$("#upHint").textContent=`فيه نسخة جديدة v${v} ✓`;ub.textContent="حدّث دلوقتي";ub.dataset.ready=1;ub.className="btn primary block"}
    else{$("#upHint").textContent="عندك آخر نسخة ✓";ub.textContent="دوّر تاني"}};
  sh.querySelector("#si").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.customers||!d.orders)throw 0;
    if(d._img){Object.entries(d._img).forEach(([k,v])=>{UIMG[k]=v;imgPut(k,v).catch(()=>{})});delete d._img}
    S=d;if(!S.adjusts)S.adjusts=[];if(!S.carton)S.carton={};save();rebuildCat(S.cat);closeSheet();toast("اترجعت النسخة");go("home")}catch(err){toast("الملف ده مش نسخة من التطبيق")}};r.readAsText(f)};
  const arm=(btn,fn)=>{btn.onclick=()=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.textContent="متأكد؟ دوس تاني";}}};
  const clr=sh.querySelector("#sclr");if(clr)arm(clr,()=>{S={v:1,demo:false,seq:1,since:Date.now(),lastBackup:0,settings:{...S.settings},products:[],carton:S.carton||{},cat:S.cat,customers:[],orders:[],requests:[],payments:[],handovers:[],adjusts:[]};save();closeSheet();toast("اتمسحت، ضيف أول عميل");go("customers")});
  arm(sh.querySelector("#sdemo"),()=>{const keep={...S.settings};const cat=S.cat;S=seed();S.settings=keep;if(cat)S.cat=cat;save();closeSheet();toast("رجعت البيانات التجريبية");go("home")});
}

/* ---------- notifications ----------
   No server: the page leaves a list of reminders (each with the time it becomes due) in Cache Storage,
   and sw.js shows the due ones when Chrome wakes it (Periodic Background Sync, installed app on Android). */
const NOTIF=[["draft","طلب اتحفظ وما اتبعتش للزميل"],["sent","طلب اتبعت ومحدش أكد إنه اتسجل"],["req","عميل مستني حاجة"],
  ["late","عميل اتأخر عن ميعاد طلبه المعتاد"],["money","عميل عليه فلوس بقاله كتير ما اتحصلتش"],["backup","ما خدتش نسخة احتياطية"]];
const notifOn=k=>(S.settings.notif||{})[k]!==false;
const canNotify=()=>"Notification" in window&&"serviceWorker" in navigator;
function notifState(){if(!canNotify())return"الإشعارات مش متاحة هنا";return Notification.permission==="granted"?"الإشعارات شغالة ✓":Notification.permission==="denied"?"الإشعارات مقفولة من المتصفح":"شغّل الإشعارات"}
function notifySnapshot(){if(!("caches" in window))return;const items=[];const add=(k,due,t)=>{if(notifOn(k))items.push({k,due,t})};
  S.orders.filter(o=>o.status==="draft").forEach(o=>add("draft",o.created+(+S.settings.remind||0)*DAY,`طلب ${cust(o.customerId).name} لسه ما اتبعتش`));
  S.orders.filter(o=>o.status==="sent").forEach(o=>add("sent",(o.hist.sent||o.created)+2*DAY,`طلب #${o.no} اتبعت ومحدش أكد تسجيله`));
  S.requests.filter(r=>!r.done).forEach(r=>add("req",r.created+DAY,`${cust(r.customerId).name} مستني: ${r.text}`));
  S.customers.forEach(c=>{const ts=S.orders.filter(o=>o.customerId===c.id).map(o=>o.created).sort((a,b)=>a-b);
    if(ts.length>=3){let g=0;for(let i=1;i<ts.length;i++)g+=ts[i]-ts[i-1];const avg=Math.max(1,Math.round(g/(ts.length-1)/DAY));
      add("late",sod(ts[ts.length-1])+Math.max(avg*1.5,avg+5)*DAY,`${c.name} اتأخر عن طلبه المعتاد · كلّمه`)}
    const b=balance(c.id);if(b>0)add("money",(lastPayment(c.id)||S.since||Date.now())+14*DAY,`${c.name} عليه ${Math.round(b).toLocaleString("en-US")} ج`)});
  if(!S.demo)add("backup",(S.lastBackup||S.since||Date.now())+3*DAY,"خد نسخة احتياطية من الإعدادات");
  caches.open("mandoub-notify").then(c=>c.put("notify.json",new Response(JSON.stringify({items,at:Date.now()}),{headers:{"Content-Type":"application/json"}}))).catch(()=>{})}
async function enableNotif(){if(!canNotify())return"الموبايل ده أو المتصفح ده مش بيدعم الإشعارات.";
  const p=await Notification.requestPermission();if(p!=="granted")return"لازم تسمح بالإشعارات علشان تشتغل. لو قفلتها، افتحها من إعدادات كروم للموقع ده.";
  notifySnapshot();const reg=await navigator.serviceWorker.ready;
  if(!("periodicSync" in reg))return"الإشعارات اتسمحت، بس الموبايل ده مش بيصحّي التطبيق في الخلفية (زي الآيفون). هتشوف التذكيرات لما تفتحه.";
  try{await reg.periodicSync.register("mandoub-remind",{minInterval:6*3600e3});return"تمام ✓ هيفكّرك لما يكون فيه حاجة محتاج تفتكرها."}
  catch(e){return"الإشعارات اتسمحت. علشان التذكير في الخلفية يشتغل، ثبّت التطبيق على الشاشة الرئيسية من ⋮ ← Add to Home screen."}}
async function testNotif(){if(!canNotify()||Notification.permission!=="granted")return"شغّل الإشعارات الأول.";
  const reg=await navigator.serviceWorker.ready;const n=alerts().length;
  reg.showNotification("SalesGo",{body:n?`عندك ${n} حاجات في «محتاج تفتكر»`:"كله تمام، مفيش حاجة متأخرة",icon:"icon-192.png",badge:"icon-192.png",tag:"mandoub-test",dir:"rtl",lang:"ar"});return""}

/* ---------- updates ----------
   The newest version number is read from sw.js on the server (CACHE "mandoub-vN"). Updating clears the app's
   cached files (never the data, which lives in localStorage) and reloads, so the new files come down. */
async function latestVersion(){try{const r=await fetch("sw.js?check="+Date.now(),{cache:"no-store"});const m=(await r.text()).match(/mandoub-v(\d+)/);return m?+m[1]:null}catch(e){return null}}
async function applyUpdate(){toast("بحدّث…");
  // only clear the saved copy when the server answers, or the app would have nothing to open offline
  if(await latestVersion()===null){toast("مقدرتش أوصل للنت. جرّب على الداتا");return}
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update().catch(()=>{});
  const ks=await caches.keys();await Promise.all(ks.filter(k=>k!=="mandoub-notify").map(k=>caches.delete(k)))}catch(e){}
  location.reload()}
function upBar(text,fn){if($("#upBar"))return;const b=document.createElement("button");b.id="upBar";b.className="upbar";b.textContent=text;b.onclick=fn;document.body.appendChild(b)}
// on open: if a newer version is on the server, offer it in a small bar
setTimeout(async()=>{const v=await latestVersion();if(v&&v>VERSION)upBar("فيه نسخة جديدة من البرنامج · دوس علشان تحدّث",applyUpdate)},3000);
// a slow line opened the saved copy and the fresh one arrived afterwards: one tap shows it (no cache clearing needed)
navigator.serviceWorker?.addEventListener("message",e=>{if(e.data&&e.data.type==="fresh")latestVersion().then(v=>{if(v&&v>VERSION)upBar("النسخة الجديدة نزلت · دوس علشان تفتحها",()=>location.reload())})});

/* ---------- trial licence ----------
   Only on the trial site (a hostname with "trial"): each rep types an activation code. licenses.json on the server
   keeps a hash of each code with its last day; Hassan stops («off») or extends («until») a code there and redeploys.
   The app asks the server on every open with internet; past the last day, or 3 days without asking, it locks.
   Locking never touches the data, and a backup can still be downloaded from the lock screen. */
const TRIAL=/trial/i.test(location.hostname)||(()=>{try{return localStorage.getItem("mandoub.forceTrial")==="1"}catch(e){return false}})();
const LKEY="mandoub.lic",OFFLINE_DAYS=3;
const licGet=()=>{try{return JSON.parse(localStorage.getItem(LKEY))||null}catch(e){return null}};
const licSet=l=>{try{localStorage.setItem(LKEY,JSON.stringify(l))}catch(e){}};
const codeNorm=c=>norm(c).replace(/[^a-z0-9]/g,"").toUpperCase();
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
// null when the server can't be reached; otherwise {ok, why, name, until}
async function licAsk(code){let list;try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);
    const r=await fetch("licenses.json?check="+Date.now(),{cache:"no-store",signal:ctl.signal});if(!r.ok)return null;list=(await r.json()).codes||[]}catch(e){return null}
  const h=await sha("mandoub|"+codeNorm(code)),e=list.find(x=>x.h===h);
  if(!e)return {ok:false,why:"wrong"};const [y,m,d]=String(e.until).split("-").map(Number),until=new Date(y,m-1,d,23,59,59).getTime();
  if(e.off)return {ok:false,why:"off",name:e.name,until};if(Date.now()>until)return {ok:false,why:"ended",name:e.name,until};
  return {ok:true,name:e.name,until}}
function licState(){const l=licGet();if(!l)return "none";if(l.lock)return l.lock;
  if(Date.now()>l.until)return "ended";if(Date.now()-l.okAt>OFFLINE_DAYS*DAY)return "offline";return "ok"}
let licAt=0;
async function licCheck(){const l=licGet();if(!l)return licGate();licAt=Date.now();const a=await licAsk(l.code);
  if(a)licSet(a.ok?{...l,name:a.name,until:a.until,okAt:Date.now(),lock:null}:{...l,lock:a.why==="ended"?"ended":"off",until:a.until||l.until});licGate()}
function licGate(){const st=licState();let g=$("#licGate");if(st==="ok"){if(g)g.remove();return}
  if(!g){g=document.createElement("div");g.id="licGate";g.className="licgate";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");document.body.appendChild(g)}
  const l=licGet()||{},keep=`<p class="hint">بياناتك محفوظة على الموبايل ومش هتتمسح.</p>`;
  const askCode=`<label class="f">كود التفعيل<input class="inp" id="lcode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" style="direction:ltr;text-align:center;letter-spacing:2px;font-weight:800"></label>
    <button class="btn primary block" id="lgo">فعّل</button><p class="hint" id="lmsg"></p>`;
  const msg={none:["أهلًا بيك في SalesGo","دي نسخة تجربة. اكتب كود التفعيل اللي وصلك."],
    ended:["التجربة خلصت",`التجربة كانت لحد يوم ${l.until?fmtDay(l.until):""}. كلّم اللي بعتلك البرنامج علشان تكمّل.`],
    off:["الكود ده اتوقف","كلّم اللي بعتلك البرنامج علشان يرجّعه، أو اكتب كود جديد."],
    offline:["افتح النت مرة","البرنامج محتاج يتأكد من الكود مرة كل 3 أيام. افتح الداتا أو الواي فاي ودوس «جرّب تاني»."]}[st];
  g.innerHTML=`<div class="card"><div class="brandmark"><img class="lt" src="logo-light.svg" alt="SalesGo by MESTK"><img class="dk" src="logo-dark.svg" alt="SalesGo by MESTK"></div><h2>${msg[0]}</h2><p>${esc(msg[1])}</p>
    ${st==="none"?askCode:`<button class="btn primary block" id="lre">جرّب تاني</button>${keep}
      <div class="btns"><button class="btn ghost" id="lbk">نزّل نسخة من بياناتك</button><button class="btn ghost" id="lnew">كود تاني</button></div><div id="lnewBox" hidden>${askCode}</div>`}</div>`;
  const go=g.querySelector("#lgo");if(go)go.onclick=async()=>{const c=$("#lcode").value;if(codeNorm(c).length<4)return $("#lmsg").textContent="اكتب الكود";
    go.disabled=true;go.textContent="بتأكد…";const a=await licAsk(c);go.disabled=false;go.textContent="فعّل";
    if(!a)return $("#lmsg").textContent="مقدرتش أوصل للنت. افتح الداتا وجرّب تاني.";
    if(!a.ok)return $("#lmsg").textContent={wrong:"الكود ده غلط، راجعه تاني",off:"الكود ده متوقف",ended:"الكود ده خلص"}[a.why];
    licSet({code:codeNorm(c),name:a.name,until:a.until,okAt:Date.now(),lock:null});licAt=Date.now();licGate();toast(`اتفعّل ✓ التجربة لحد يوم ${fmtDay(a.until)}`);render()};
  const re=g.querySelector("#lre");if(re)re.onclick=async()=>{re.disabled=true;re.textContent="بتأكد…";await licCheck();
    if($("#licGate")){const b=$("#lre");if(b){b.disabled=false;b.textContent="جرّب تاني"}toast(licState()==="offline"?"لسه مفيش نت":"لسه متوقف")}};
  g.querySelector("#lbk")?.addEventListener("click",()=>backup());
  g.querySelector("#lnew")?.addEventListener("click",()=>{$("#lnewBox").hidden=false;$("#lcode").focus()})}
function trialBar(){if(!TRIAL)return"";const l=licGet();if(!l||!l.until)return"";const left=Math.ceil((l.until-Date.now())/DAY);
  return left<=2&&left>0?`<div class="demo">التجربة هتخلص يوم ${esc(fmtDay(l.until))}</div>`:""}

/* ---------- boot ---------- */
render();loadPhotos();
{const sp=$("#splash");if(sp){setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),320)},450)}}setTimeout(()=>{try{notifySnapshot()}catch(e){}},1500);
if("serviceWorker" in navigator&&window.isSecureContext&&window.top===window.self){navigator.serviceWorker.register("sw.js").catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();if(TRIAL&&Date.now()-licAt>6*36e5)licCheck()}});
if(TRIAL){licGate();licCheck()}
})();
</script>
